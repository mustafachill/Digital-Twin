# =============================================================================
# Large binary asset manifest
#
# Raw 3D capture data is gigabyte-scale and does not belong in git. It lives in
# Google Drive and on lab storage; this file records where each asset came from,
# what it should hash to, and where it belongs in the working tree.
#
# `./scripts/fetch-assets` reads this file. See assets/README.md for the policy.
#
# Processed, simulator-ready meshes are small enough to be committed directly
# under assets/meshes/. Those AUTHORED by hand are not listed here.
#
# Those DERIVED from a pinned dependency are, in the `derived:` section at the
# bottom, because a derived asset has a provenance an authored one does not: the
# exact file it came from, the commit that file is pinned at, and what both hash
# to. That is what makes a stale hull — a collision shape that no longer matches
# the arm, which presents as a planner bug — a detectable state rather than an
# invisible one. See ADR-0028.
#
# The `derived:` section is written by `cite-model hulls --write` and checked by
# `cite-model hulls` (no flag), which re-derives every mesh from the vendor file
# and compares. Everything above its markers is hand-written.
# =============================================================================

---

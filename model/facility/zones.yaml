---
# yaml-language-server: $schema=../schema/zones.schema.json
schema: cite/zones/v1

# Zones partition the facility; they do not nest (naming-and-namespaces.md rule
# 6). Nesting would change every name in the system and needs an ADR.
#
# ONE ZONE, AND THAT IS WHAT LETS `--zone` BE LEFT OUT. `./scripts/sim`,
# `./scripts/scenario` and `./scripts/program` default to the only zone this file
# declares, and require `--zone` again the day a second one is added (ADR-0069
# decision 5). The three-arm cell that stood here as `cell_a` runs as
# `projects/01` (ADR-0068, ADR-0069).
#
# WHAT A `bounds` BOX MEANS, because it has one meaning and not two. It encloses
# the BODIES THIS FILE'S SIBLINGS AUTHOR — pedestals, tables, belts, beams, arm
# bases — and NOT the volume an arm's links sweep.
#
# THE BOX DOES NOT CONTAIN THE ARM'S REACH, AND IS NOT MEANT TO. Forward
# kinematics over the shipped xarm5 URDF's own joint limits puts the tool point
# up to 0.9153 m from `link_base` — reported by the 2026-09-17 model-validator
# review and not re-measured here. Against that, the box below leaves 0.700 m
# toward -y from the arm base, derivable from this file: a shortfall of about
# 0.215 m. So a commanded pose at the envelope edge is outside the declared box
# by construction and not by an error.
#
# The meaning is recorded rather than the box widened. Nothing reads these
# bounds — they reach no generated artifact — so the consequence today is nil
# either way, and what a later reader needs is to know which question the box
# answers. `docs/open-work.md` #66, nothing validates that two zones' boxes are
# disjoint, INHERITS this meaning should a second zone be declared.
zones:
  - id: cell_b
    name: One-arm pick-and-place cell
    bounds:
      kind: aabb
      frame: cite_world
      # WHERE IT STANDS IS HISTORY, NOT A RULE. The box sits at +y 2.000 m
      # because it was placed clear of the three-arm cell that shared this file
      # until ADR-0069, and it reuses that cell's x datum so that every relative
      # dimension inside it — the 0.300 m arm standoff, the 0.050 m belt transfer
      # inset, the 25 mm and 50 mm fixture clearances — is a number that was
      # derived and measured there. Moving it would change every generated
      # coordinate for no gain, so it stays.
      #
      # Zones are validated one at a time — `cite_tools.validate.geometric.check`
      # is handed a single `ResolvedCell` — so should a second zone be declared,
      # nothing would check that the two boxes are disjoint (docs/open-work.md #66).
      min_m: [-1.000, 2.000, 0.000]
      max_m: [3.000, 4.000, 2.500]
    # PAIRED, and this is the system under construction (ADR-0059): two sides,
    # one of everything on each. It read `single` until 2026-09-18, when the
    # project owner decided that the target is two twin sides rather than the
    # three-arm cell; ADR-0056 had declared this zone unpaired and deferred the
    # flip to a record of its own, and ADR-0059 is it. Since ADR-0070 the PLANT
    # is simulated and the COUNTERPART is the physical xArm 5 on its track
    # (`counterpart_backend: real` on `picker` and `picker_track`).
    #
    # WHAT THIS LINE DOES NOT BUY, because a declaration is not a test. Nothing
    # automated brings the pair up: ADR-0057's promotion clause 4 asks for a
    # paired SCENARIO in CI and there is none, so a regression in the witness,
    # the readiness token, the boundary or either side's bring-up fails no gate
    # outside `cite_twin`'s own tests. What CI drives on this zone is still the
    # PLANT ALONE.
    #
    # WHAT KEEPS THE PHYSICAL SIDE FROM MOVING BY ACCIDENT. A physical PLANT on
    # a paired zone is still an ERROR at validate time
    # (`physical-plant-on-paired-zone`), so the side every scenario addresses
    # stays simulated. The physical counterpart is gated at bring-up: a plan
    # declaring it refuses to start without CITE_ALLOW_HARDWARE=1 (ADR-0054),
    # and its address is an environment reference to CITE_XARM_IP, never
    # committed, which the physical side's launch is to resolve.
    # `cite_bringup`'s hardware launch brings that side up with the track
    # adapter, the gripper relay and the deadman (ADR-0070 items 3-6), and no
    # physical arm has been driven through it.
    twin:
      sides: pair
      # How often the twin boundary tells each side it is alive (ADR-0070 item
      # 5). The physical side's deadman trips after several missed periods.
      heartbeat_period_s: 0.1
      # The physical counterpart's timing, steady-clock seconds. The deadman
      # timeout is five heartbeat periods: above the Wi-Fi link's round trips
      # probed on 2026-10-05 (a few 150 Hz controller periods at the 99th
      # percentile; a probe, not a campaign), and at least three periods by
      # rule (`deadman-timeout-below-three-heartbeats`). The state age bounds
      # how stale a deadman state a relay acts on, and how stale a joint the
      # boundary counts as fresh; above the tick and every poll period.
      physical_side:
        deadman_timeout_s: 0.5
        deadman_tick_period_s: 0.05
        call_deadline_s: 0.25
        state_max_age_s: 0.25

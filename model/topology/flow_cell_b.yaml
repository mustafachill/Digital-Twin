---
# yaml-language-server: $schema=../schema/flow.schema.json
schema: cite/flow/v1

# `cell_b`'s process flow. ONE FILE PER ZONE: `FlowDocument` holds exactly one
# `flow`, so a second zone's edges would need a file of their own. The loader
# globs every *.yaml under model/ and dispatches on the document's own `schema:`
# key, so the file name carries no meaning beyond telling a reader which zone
# they are looking at.
#
# THIS FILE IS NOT OPTIONAL, AND ITS ABSENCE WOULD BE SILENT. A zone with no flow
# document generates no topology at all — `cite_tools.generate.topology` returns
# early when it finds no flow for the zone — and with no topology the
# `unreachable-station` check never runs either, so the model would validate
# clean while `program_cycle` had no station frames to read. That is pinned by a
# test rather than described: see
# tools/tests/test_every_zone_has_a_flow_document.py, which fails if any declared
# zone loses its flow.
#
# TABLE -> ARM -> BELT, in two edges. The arm picks a part off `infeed_table` and
# places it on `transfer_belt/infeed`; the belt carries it out of the cell to
# `outfeed_table`. Three stations is the minimum; see stations.yaml for the
# rules that enforce it.
#
# The behaviour-tree line that consumed this topology — and with it ADR-0039's
# stall detector and ADR-0031's direct-handoff refusal — runs as `projects/01`
# (ADR-0069). The topology is still generated, and `program_cycle` reads its
# station frames from it.
flow:
  id: cell_b_pick_and_place
  zone: cell_b
  edges:
    # Fed from outside the cell onto a table. `buffer: 6` is `b_infeed`'s own
    # capacity: the table holds what the source station says it holds.
    - {from: b_infeed, to: b_transfer_1, via: null, buffer: 6}
    # 1.2 m of belt holds four pieces comfortably, and this 4 is also the
    # effective concurrency: nothing stops this belt, because `b_accumulation`
    # is a sink with no handoff to complete, so pieces on it keep moving.
    - {from: b_transfer_1, to: b_accumulation, via: transfer_belt, buffer: 4}

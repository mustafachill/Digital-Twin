---
# yaml-language-server: $schema=../schema/stations.schema.json
schema: cite/stations/v1

# A station says what it is connected to, never what it does. Behaviour is L4's —
# that separation is what keeps a layout change from being a code change.
#
# Every pick and place point is a reference to a frame on another asset. There is
# no coordinate anywhere in this file, which is the property that made v1's
# diverged pick/place tables impossible to reproduce here.
stations:
  # THREE STATIONS: a source, the one acting station and a sink. With one arm
  # there is exactly one possible actor, and `schema.py` requires at least one
  # flow edge while `referential.py` refuses a self-edge, so the remaining slots
  # are a source and a sink.
  #
  # EVERY ID BELOW HAS TO NAME AN ASSET OF THIS STATION'S ZONE, AND NOTHING
  # CHECKS THAT. `referential.py` resolves station and flow references against
  # GLOBALLY known ids, so naming another zone's asset would pass referential
  # validation and then skip its reach check in silence, because the geometric
  # level only ever sees one zone's assets. With one zone declared it cannot
  # happen; it is filed as a validator gap in docs/open-work.md for the day a
  # second zone is.
  - id: b_infeed
    zone: cell_b
    type: source_station
    assets: [infeed_table]
    capacity: 6

  # The cell's only acting station: pick off the table, place on the belt. Its
  # inbound edge is `via: null`; see model/topology/flow_cell_b.yaml, where that
  # edge is declared.
  - id: b_transfer_1
    zone: cell_b
    type: transfer_station
    actor: picker
    assets: [picker, picker_track]
    pick_from: {asset: infeed_table, frame: surface}
    # NO `place_to` (ADR-0067). The arm rides a track, and the belt's infeed is
    # 1.094 m from its base with the carriage at stroke zero, against a 0.700 m
    # reach. Only the real program moves the track — it places there at
    # +0.650 m — so a `place_to` on the belt would be a point a fixed-base
    # Pick and Place cannot reach, and `unreachable-station` refuses it. The flow
    # edge still says where the part goes; `program_cycle` is what drives and
    # checks this cell.
    trigger: {sensor: infeed_beam, state: blocked}

  # The sink. It has a trigger and no actor: nothing here acts, and the trigger is
  # what makes the arrival observed rather than counted when the arm let go —
  # which is a statement about a gripper and not about the table.
  - id: b_accumulation
    zone: cell_b
    type: sink_station
    assets: [outfeed_table]
    capacity: 12
    trigger: {sensor: outfeed_beam, state: blocked}

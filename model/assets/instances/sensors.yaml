---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# Break-beam sensors just short of each belt's outfeed transfer point, placed
# relative to that belt rather than in world coordinates — so moving a conveyor,
# or moving the transfer point on its type, moves the sensor with it and the two
# cannot drift apart. That anchoring is what made the 0.050 m outfeed inset a
# one-line change here: nothing in this file needed touching for it.
#
# Two things about the offset below are load-bearing rather than incidental.
#
# +Y, not the belt centreline. The outfeed is also a station's pick point, and a
# housing standing on the centreline puts 120 mm of solid geometry inside the
# gripper's descent. The belt is 0.400 m wide, so +0.250 clears its edge by
# 30 mm and stands on the side away from the arms, which work from -Y.
# `approach-obstruction` in cite_tools.validate.geometric now rejects the old
# placement mechanically.
#
# +0.030 above the belt surface, not +0.080, and STILL AUTHORED. Deriving it from
# work-piece geometry was considered once L0 gained some, and rejected on what
# the simulated beam actually measures.
#
# The plugin's beam test is a point test on the work-piece's model ORIGIN, not an
# intersection with its body. With `beam_width_m` 0.040 the sensor therefore
# reports a part whose centre lies within 0.020 m of this offset — a window of
# part-centre heights 0.010 m to 0.050 m above the belt. A part at rest has its
# centre half its own height up, so this sensor detects a part between 20 mm and
# 100 mm tall, and the 50 mm cube sits at 25 mm, in the middle of that window.
#
# There is no work-piece dimension to derive that from. A height fitted to the
# shortest declared part would centre the window on that part and start losing
# taller ones; the value that covers the widest range of parts is the smallest
# one that still clears the belt surface, which is what 30 mm is. What this
# comment used to claim — that a floor works "for any part" because a beam has to
# pass below the top of what it detects — describes a real through beam and not
# this one: a part taller than 100 mm passes over the window and is missed. That
# is a limitation of the point test, not of this number, and it is recorded in
# workspace/src/cite_simulation/README.md rather than papered over here.
#
# 80 mm, for the record, put the window at part-centre heights 0.060 to 0.100 m
# and cleared the 50 mm cube entirely — a sensor that could never be broken, on a
# line whose stations are supposed to act on detection rather than on elapsed
# time.
assets:
  # The infeed's own presence sensor.
  #
  # WHY IT EXISTS. `station_transfer_1` is fed from outside the cell, and until
  # this beam it was the one acting station in the line with nothing to observe.
  # Its cycle fell through `AwaitTrigger` — no topic, so no wait — and came to
  # rest in `DetectAt`, which polls for ever when a station has no trigger. The
  # measured symptom was a station reporting WORKING with occupancy 0/1 while a
  # `Detect` on `table_pick/surface` answered "no sensor in this zone lies inside
  # the requested region". A station that acts must observe; this is what it
  # observes with.
  #
  # WHY NOT SIMPLY STOP GATING THE STATION. The alternative was to let a
  # source-fed station pick without observing, on the ground that it was told
  # about the part rather than seeing it. Nothing tells it: the only thing that
  # would then bound its cycle is the pick failing, so an empty table would send
  # the arm down to check and burn the station's retry budget doing it. A robot
  # busy-wait is a worse answer than a sensor, and `break_beam.yaml` states the
  # rule this line is built on — a station acts because a work-piece was
  # detected, never because a duration elapsed.
  #
  # THE OFFSET IS THE SAME +0.250 AS EVERY OTHER BEAM, and for the same two
  # reasons. It stands on the side away from the arms, which work from -Y — every
  # pedestal is at y = -0.300. And it clears the gripper's descent: the approach
  # corridor `cite_tools.validate.geometric` enforces is 0.100 m of half-width
  # about the pick point, so a 0.040 m housing has to stand further out than
  # 0.120 m or `approach-obstruction` rejects it. The table is 0.600 m square, so
  # 0.250 m leaves the housing 0.030 m inside its own edge, exactly as 0.250 m on
  # a 0.400 m belt leaves 0.030 m of belt edge to spare.
  #
  # The height is the belts' 0.030 m for the reason given at length below: the
  # plugin's beam test is a point test on the work-piece ORIGIN, and 0.030 m puts
  # the window at part-centre heights 0.010 m to 0.050 m above the surface, which
  # is where a part between 20 mm and 100 mm tall rests. Nothing about that
  # reasoning is specific to a belt.
  - id: beam_pick
    zone: cell_a
    type: break_beam
    pose:
      frame: table_pick/surface
      xyz_m: [0.000, 0.250, 0.030]
    hardware: {backend: sim}
    configuration:
      kind: sensor
      beam_axis: y
      beam_length_m: 0.500
      idle_state: clear

  - id: beam_c1_out
    zone: cell_a
    type: break_beam
    pose:
      frame: conveyor_1/outfeed
      # 50 mm upstream of the outfeed transfer point — so 100 mm back from the
      # belt's physical end — beside the belt, 30 mm above its surface.
      xyz_m: [-0.050, 0.250, 0.030]
    hardware: {backend: sim}
    configuration:
      kind: sensor
      beam_axis: y
      beam_length_m: 0.500
      idle_state: clear

  - id: beam_c2_out
    zone: cell_a
    type: break_beam
    pose:
      frame: conveyor_2/outfeed
      xyz_m: [-0.050, 0.250, 0.030]
    hardware: {backend: sim}
    configuration:
      kind: sensor
      beam_axis: y
      beam_length_m: 0.500
      idle_state: clear

  - id: beam_c3_out
    zone: cell_a
    type: break_beam
    pose:
      frame: conveyor_3/outfeed
      xyz_m: [-0.050, 0.250, 0.030]
    hardware: {backend: sim}
    configuration:
      kind: sensor
      beam_axis: y
      beam_length_m: 0.500
      idle_state: clear

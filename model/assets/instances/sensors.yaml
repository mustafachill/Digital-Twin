---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# Break-beam sensors, placed relative to the frame they watch rather than in
# world coordinates — so moving a table or a conveyor, or moving the transfer
# point on its type, moves the sensor with it and the two cannot drift apart.
#
# Two beams, and NEITHER indexes. Indexing means stopping a moving belt at a
# point a station picks from, and in this cell no station picks from a belt at
# all: the arm picks from a table, and the belt only carries the finished part
# away. The indexing beams of the three-arm line, and the measurement history
# behind deriving an index offset from the part (ADR-0033), run as `projects/01`
# (ADR-0069); `cite_tools.model.resolve.index_offset_m` and the validator rules
# about indexing are kept and still apply to any beam that declares it.
#
# Two things about the offsets below are load-bearing rather than incidental.
#
# 0.250 m ACROSS, on the side away from the arm. A housing standing on the
# station point puts solid geometry inside the gripper's descent; the approach
# corridor `cite_tools.validate.geometric` enforces is 0.100 m of half-width
# about a pick point, so a 0.040 m housing has to stand further out than 0.120 m
# or `approach-obstruction` rejects it. On a 0.400 m belt 0.250 m clears the
# edge by 30 mm, and on a 0.600 m table it leaves the housing 30 mm inside the
# edge. Since the arm moved onto its track (ADR-0067) it works on the pick table
# from +y, so `infeed_beam`'s housing is at -0.250 m; `outfeed_beam` is nowhere
# near the arm and keeps +0.250 m.
#
# +0.030 above the surface, and AUTHORED — a mounting height, not a derived one,
# because what it has to satisfy is a range rather than a point: high enough to
# clear the surface, low enough to pass under the top of the shortest part the
# cell handles. `beam-cannot-see-workpiece` in cite_tools.validate.geometric
# fails the model if a declared part is ever short enough to walk under it. The
# beam intersects the part's body rather than its origin, so there is no upper
# bound — a part of any height breaks it — and the only bound left is the
# physical one this height states, which holds identically on hardware.
assets:
  # What tells `b_transfer_1` that a part is there to pick. The cell's infeed is
  # a table fed from outside, so this is the station's only observation.
  #
  # A STATION THAT ACTS MUST OBSERVE. The alternative was to let a source-fed
  # station pick without observing, on the ground that it was told about the
  # part rather than seeing it. Nothing tells it: the only thing that would then
  # bound its cycle is the pick failing, so an empty table would send the arm
  # down to check. A robot busy-wait is a worse answer than a sensor, and
  # `break_beam.yaml` states the rule this is built on — a station acts because
  # a work-piece was detected, never because a duration elapsed.
  #
  # It does not index: a table is not driven, so there is nothing to stop.
  - id: infeed_beam
    zone: cell_b
    type: break_beam
    pose:
      frame: infeed_table/surface
      xyz_m: [0.000, -0.250, 0.030]
    hardware: {backend: sim}
    configuration:
      kind: sensor
      beam_axis: y
      beam_length_m: 0.500
      idle_state: clear

  # What makes the arrival at `outfeed_table` observed rather than inferred. The
  # station it triggers is a sink with no actor, nothing picks from
  # `transfer_belt/outfeed`, so the belt is never stopped and there is no rest
  # position to stand off from.
  #
  # `indexes_workpiece` IS DELIBERATELY ABSENT, and declaring it would be an
  # ERROR rather than a harmless extra: `beam-indexes-no-pick-point` in
  # cite_tools.validate.geometric refuses a beam that indexes to a frame no
  # station picks from, which is exactly this frame. Its 50 mm upstream position
  # is an ordinary authored mounting offset, because nothing derives one.
  - id: outfeed_beam
    zone: cell_b
    type: break_beam
    pose:
      frame: transfer_belt/outfeed
      xyz_m: [-0.050, 0.250, 0.030]
    hardware: {backend: sim}
    configuration:
      kind: sensor
      beam_axis: y
      beam_length_m: 0.500
      idle_state: clear

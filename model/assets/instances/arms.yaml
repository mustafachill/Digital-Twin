---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# One xArm 5 instance. Its type and gripper come from the component library,
# which is what makes adding an arm a data change rather than a code change (P9).
#
# The three-arm cell that shared this file until ADR-0069 runs as `projects/01`.
#
# ASSET IDS ARE FACILITY-UNIQUE, AND THAT IS THE HAZARD A NAME HAS TO CARRY.
# `cite_tools.model.ids` namespaces topics, actions and frames by zone, but
# joint, link, controller and `_mount` names are built from the ASSET ID ALONE,
# and `referential.py` requires asset ids to be unique across the whole
# facility rather than per zone. A second asset of the same id in another zone
# would therefore collide on every one of those, inside a generated artifact,
# with no finding anywhere.
#
# A ROLE NAME CARRIES IT. `picker` is unique across the facility exactly as a
# zone-prefixed id would be, and it says what the asset does — which is what a
# reader of `picker_joint3` or `picker_traj_controller` actually needs, since
# the zone is not a fact about the joint. The alternative was a zone prefix,
# which encodes the zone a second time in a spelling NOTHING DERIVES AND
# NOTHING VALIDATES, and stutters in generated names (`cell_b_b_arm_1`). The
# project owner chose role names on 2026-09-17.
#
# It stands on the carriage of a linear track rather than on a pedestal, yawed
# -90 degrees so that its left is the track's direction of travel; see
# model/assets/instances/tracks.yaml for why, and for the layout the real
# program's poses put around it (ADR-0067). The yaw is written in radians
# because ADR-0020 forbids a second representation of an angle;
# `cite-model show` renders degrees for reading.
assets:
  - id: picker
    zone: cell_b
    type: xarm5
    pose:
      frame: picker_track/carriage
      xyz_m: [0.000, 0.000, 0.000]
      rpy_rad: [0.0, 0.0, -1.570796327]
    end_effector:
      type: xarm_parallel_gripper
      vendor_integrated: true
    # The plant is simulated and the counterpart is the physical xArm 5
    # (ADR-0070): the generator emits that side a description and controller
    # configuration of its own, carrying the same names.
    #
    # The address is an ENVIRONMENT REFERENCE and never a value: the project
    # owner decided on 2026-10-05 that the robot's address is not committed. It
    # lives in the gitignored `.env` as CITE_XARM_IP, the generated plan names
    # the variable, and bring-up refuses to start that side when it is unset.
    hardware:
      backend: sim
      counterpart_backend: real
      params:
        real:
          robot_ip: {env: CITE_XARM_IP, kind: ip_address}
    configuration:
      kind: robot
      # A retracted, collision-free pose the arm returns to between cycles.
      home_rad: [0.0, -0.35, -1.05, 0.0, 1.40]
      # The program this arm runs: the real xArm 5's own, read from the file the
      # robot's programming tool wrote (ADR-0067). Its poses, gripper widths,
      # speeds and track moves all come from there; none is copied into this
      # model. The poses ADR-0066 taught here were taught against the layout
      # before the track and no longer describe this cell, so they are gone.
      program: programs/xarm5_real_demo.blockly.xml
    # Written by `cite-model register` in Phase 2, never by hand. Kept apart from
    # `pose` so a measurement can never overwrite engineered intent.
    registration:
      status: unregistered

---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# Three xArm 5 instances. They differ only in id and where they stand — the
# component library holds everything else, which is what makes adding a fourth
# arm a data change rather than a code change (P9).
#
# Each is placed against its pedestal's `top` frame and yawed +90 degrees to face
# the belt centreline at +Y. The yaw is written in radians because ADR-0020
# forbids a second representation of an angle; `cite-model show` renders degrees
# for reading.
assets:
  - id: arm_1
    zone: cell_a
    type: xarm5
    pose:
      frame: pedestal_1/top
      xyz_m: [0.000, 0.000, 0.000]
      rpy_rad: [0.0, 0.0, 1.570796327]
    end_effector:
      type: xarm_parallel_gripper
      # The vendor description builds the gripper in, so no second description
      # is emitted for it.
      vendor_integrated: true
    # Required with no default: a schema default here would let an arm become
    # `real` because someone omitted a key, and cross-cutting-safety.md is
    # explicit that a mode must never be reachable by omission.
    hardware:
      backend: sim
    configuration:
      kind: robot
      # A retracted, collision-free pose the arm returns to between cycles.
      home_rad: [0.0, -0.35, -1.05, 0.0, 1.40]
    # Written by `cite-model register` in Phase 2, never by hand. Kept apart from
    # `pose` so a measurement can never overwrite engineered intent.
    registration:
      status: unregistered

  - id: arm_2
    zone: cell_a
    type: xarm5
    pose:
      frame: pedestal_2/top
      xyz_m: [0.000, 0.000, 0.000]
      rpy_rad: [0.0, 0.0, 1.570796327]
    end_effector:
      type: xarm_parallel_gripper
      vendor_integrated: true
    hardware:
      backend: sim
    configuration:
      kind: robot
      home_rad: [0.0, -0.35, -1.05, 0.0, 1.40]
    registration:
      status: unregistered

  - id: arm_3
    zone: cell_a
    type: xarm5
    pose:
      frame: pedestal_3/top
      xyz_m: [0.000, 0.000, 0.000]
      rpy_rad: [0.0, 0.0, 1.570796327]
    end_effector:
      type: xarm_parallel_gripper
      vendor_integrated: true
    hardware:
      backend: sim
    configuration:
      kind: robot
      home_rad: [0.0, -0.35, -1.05, 0.0, 1.40]
    registration:
      status: unregistered

  # ------------------------------------------------------------------------ #
  # cell_b — the one-arm cell (ADR-0056)
  # ------------------------------------------------------------------------ #
  #
  # ASSET IDS ARE FACILITY-UNIQUE, AND THAT IS THE HAZARD A NAME HAS TO CARRY.
  # `cite_tools.model.ids` namespaces topics, actions and frames by zone, but
  # joint, link, controller and `_mount` names are built from the ASSET ID ALONE,
  # and `referential.py` requires asset ids to be unique across the whole
  # facility rather than per zone. A second `arm_1` would therefore collide on
  # every one of those, inside a generated artifact, with no finding anywhere.
  #
  # A ROLE NAME CARRIES IT. `picker` is unique across the facility exactly as a
  # zone-prefixed id would be, and it says what the asset does — which is what a
  # reader of `picker_joint3` or `picker_traj_controller` actually needs, since
  # the zone is not a fact about the joint. The alternative was a `b_` prefix,
  # which encodes the zone a second time in a spelling NOTHING DERIVES AND
  # NOTHING VALIDATES: `cite_tools` never reads it, no rule requires it, and an
  # asset moved between zones keeps the old letter and becomes a lie. It also
  # stuttered — generated artifact names are `<zone>_<asset>`, so `b_arm_1` in
  # `cell_b` produced `cell_b_b_arm_1.urdf.xacro`.
  #
  # The project owner chose consistency here on 2026-09-17, after all three
  # variants were measured: each validates clean at all three levels for both
  # zones and each leaves `cell_a` byte-identical, so cost was not a
  # discriminator.
  #
  # Everything else about this arm is `arm_1`: same type, same vendor-integrated
  # gripper, same home pose, standing on its own pedestal's `top` frame and yawed
  # +90 degrees to face the belt centreline at +Y. The cell it works in differs;
  # the arm does not.
  - id: picker
    zone: cell_b
    type: xarm5
    pose:
      frame: picker_base/top
      xyz_m: [0.000, 0.000, 0.000]
      rpy_rad: [0.0, 0.0, 1.570796327]
    end_effector:
      type: xarm_parallel_gripper
      vendor_integrated: true
    # `sim` on both sides. ADR-0048 clause 1 refuses an asset whose two sides
    # declare different backends, and ADR-0056 leaves hardware to Phase 2.B.
    hardware:
      backend: sim
    configuration:
      kind: robot
      home_rad: [0.0, -0.35, -1.05, 0.0, 1.40]
      # The fixed program's poses (ADR-0066), in joint order joint1..joint5.
      # TAUGHT, not computed, the way a pose is taught on the real arm: the
      # existing Pick and Place skills were run once in simulation, on 2026-09-28,
      # against `infeed_table/surface` and `transfer_belt/infeed` with a 50 mm
      # work-piece, and `/cite/cell_b/picker/joint_states` was read where the arm
      # stood still - at Pick's approach and grasp, and at Place's approach and
      # release. They are only as good as that layout: move a station and they
      # must be taught again. Joint limits are not checked here, because L0 does
      # not read the vendor description; the planning group refuses an
      # out-of-range pose at `MoveTo`.
      poses_rad:
        pick_above: [1.0071, 0.4035, -1.3630, 0.9590, 2.5778]
        pick: [1.0075, 0.5688, -1.3065, 0.7373, 2.5783]
        place_above: [-1.0300, 0.4576, -1.4875, 1.0299, 0.5408]
        place: [-1.0304, 0.6043, -1.4145, 0.8103, 0.5404]
    registration:
      status: unregistered

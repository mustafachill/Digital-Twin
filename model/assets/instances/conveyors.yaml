---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# Three 1.2 m belts, centred between consecutive arms. Each belt's infeed and
# outfeed resolve through the type's frames, so no station ever writes a belt-end
# coordinate:
#
#   conveyor_1  centre 1.050  ->  infeed 0.450   outfeed 1.650
#   conveyor_2  centre 3.150  ->  infeed 2.550   outfeed 3.750
#   conveyor_3  centre 5.250  ->  infeed 4.650   outfeed 5.850
assets:
  - id: conveyor_1
    zone: cell_a
    type: belt_1200x400
    pose:
      frame: cite_world
      xyz_m: [1.050, 0.000, 0.000]
    hardware: {backend: sim}
    configuration:
      kind: conveyor
      # The drive's installed setting — a physical fact about the machine. The
      # runtime setpoint is L4's decision and does not belong in the model.
      installed_speed_mps: 0.150
      direction: forward

  - id: conveyor_2
    zone: cell_a
    type: belt_1200x400
    pose:
      frame: cite_world
      xyz_m: [3.150, 0.000, 0.000]
    hardware: {backend: sim}
    configuration:
      kind: conveyor
      installed_speed_mps: 0.150
      direction: forward

  - id: conveyor_3
    zone: cell_a
    type: belt_1200x400
    pose:
      frame: cite_world
      xyz_m: [5.250, 0.000, 0.000]
    hardware: {backend: sim}
    configuration:
      kind: conveyor
      installed_speed_mps: 0.150
      direction: forward

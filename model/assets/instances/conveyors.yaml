---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# One 1.2 m belt, on cell_b's linear-track layout (ADR-0067). Its infeed and
# outfeed resolve through the type's frames, so no station ever writes a belt-end
# coordinate. Those frames are transfer points inset 0.055 m from the belt's
# ends, not the ends themselves — see the type for the measurements behind the
# inset — so the belt span and the transfer points are different numbers:
#
#   transfer_belt  centre 1.310  ->  belt 0.710..1.910  infeed 0.765  outfeed 1.855
#
# Its infeed frame is where the real program's place pose puts the part: under
# the pads with the track at 650 mm, derived in
# model/assets/instances/tracks.yaml. Its centreline is at y 3.060 for the same
# reason.
#
# IT STANDS 0.035 m UP, ON A RISER THE MODEL DOES NOT DRAW. The program releases
# the part with its underside at z 0.639; a belt at the type's 0.600 m would
# drop it 39 mm, and at 0.635 m it drops 4 mm. The riser is a mounting, not a
# body: nothing stands in the 35 mm under the belt's box.
#
# It is the `via` of the only belt-mediated edge in this cell, carrying the part
# from `b_transfer_1` out to the sink. It is never indexed and never stopped:
# `b_accumulation` is a sink with a trigger and no actor, so it has no handoff
# to complete, and nothing picks from this belt's outfeed. It runs continuously.
# It is NOT part of the twin (ADR-0067): each side's belt is run on that side
# alone.
assets:
  - id: transfer_belt
    zone: cell_b
    type: belt_1200x400
    pose:
      frame: cite_world
      xyz_m: [1.310, 3.060, 0.035]
    hardware: {backend: sim}
    configuration:
      kind: conveyor
      # The drive's installed setting — a physical fact about the machine. The
      # runtime setpoint is the caller's decision and does not belong in the model.
      installed_speed_mps: 0.150
      direction: forward

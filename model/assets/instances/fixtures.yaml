---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# Pedestals and tables. Placed first because arms and work areas are placed
# relative to *their* frames, so the height of the line is stated once.
#
# LAYOUT STATUS: PROVISIONAL. These are engineered coordinates, not a survey of
# the building. Charter §8 puts the physical scan in Phase 3; until then a
# measurement taken from this model does not transfer to the room. Stated here
# rather than implied, per P7.
#
# The line runs along +X. Every arm sits 0.35 m in front of the belt centreline
# and reaches 0.475 m along ∓X, giving a 0.590 m working distance against a
# 0.700 m envelope.
#
# The tables are held clear of their neighbours rather than butted against them.
# A table whose face exactly touches a pedestal validates today only because the
# overlap test uses a strict inequality: one micrometre of Phase-2 registration
# correction turns it into a penetration the physics engine resolves by flinging
# both bodies apart. `insufficient-clearance` warns below
# geometric.MIN_CLEARANCE_M, and these poses are chosen to sit above it:
#
#   table_pick          x ends   -0.175  |  pedestal_1 x starts -0.150  ->  25 mm
#   table_accumulation  x starts  5.900  |  conveyor_3 x ends    5.850  ->  50 mm
#
# table_pick cannot move further out than this: its `surface` frame is
# station_transfer_1's pick point, and at -0.475 arm_1 already reaches 84% of its
# 0.700 m envelope. Buying more clearance here costs reach margin there.
assets:
  # --- arm pedestals ---
  - id: pedestal_1
    zone: cell_a
    type: pedestal_600
    pose:
      frame: cite_world
      xyz_m: [0.000, -0.350, 0.000]
    hardware: {backend: sim}

  - id: pedestal_2
    zone: cell_a
    type: pedestal_600
    pose:
      frame: cite_world
      xyz_m: [2.100, -0.350, 0.000]
    hardware: {backend: sim}

  - id: pedestal_3
    zone: cell_a
    type: pedestal_600
    pose:
      frame: cite_world
      xyz_m: [4.200, -0.350, 0.000]
    hardware: {backend: sim}

  # --- work surfaces at each end of the line ---
  - id: table_pick
    zone: cell_a
    type: work_table_600
    pose:
      frame: cite_world
      xyz_m: [-0.475, 0.000, 0.000]
    hardware: {backend: sim}

  - id: table_accumulation
    zone: cell_a
    type: work_table_600
    pose:
      frame: cite_world
      xyz_m: [6.200, 0.000, 0.000]
    hardware: {backend: sim}

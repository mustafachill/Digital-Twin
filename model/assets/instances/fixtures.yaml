---
# yaml-language-server: $schema=../../schema/asset_instances.schema.json
schema: cite/asset_instances/v1

# Tables. Placed first because work areas are placed relative to *their*
# frames, so the height of the work surface is stated once.
#
# LAYOUT STATUS: PROVISIONAL. These are engineered coordinates, not a survey of
# the building. Charter §8 puts the physical scan in Phase 3; until then a
# measurement taken from this model does not transfer to the room. Stated here
# rather than implied, per P7.
#
# WHERE THEY STAND IS DERIVED FROM THE PROGRAM. The arm rides a linear track and
# runs the real robot's own program, and where the pick table and the belt
# stand is DERIVED from that program's pick and place poses by forward
# kinematics. The derivation, and the numbers, are in
# model/assets/instances/tracks.yaml and are not restated here. The pedestals
# and tables of the three-arm cell that shared this file until ADR-0069 run as
# `projects/01`.
#
# The tables are held clear of their neighbours rather than butted against them.
# A table whose face exactly touches another body validates today only because
# the overlap test uses a strict inequality: one micrometre of Phase-2
# registration correction turns it into a penetration the physics engine
# resolves by flinging both bodies apart. `insufficient-clearance` warns below
# geometric.MIN_CLEARANCE_M, and these poses are chosen to sit above it.
assets:
  # The cell's only pick surface, and the long bench the track and the arm stand
  # on (see its type, and model/assets/instances/tracks.yaml). Footprint
  # x -0.800..0.650, y 2.624..3.424: its `surface` frame, the pick point, lands
  # at (-0.500, 2.924, 0.600), exactly where the 0.6 m table's centre did. Its
  # +x face stands 60 mm clear of the belt. The track stands ON it, placed on
  # its `surface` frame, which is how the model says the two are in contact.
  - id: infeed_table
    zone: cell_b
    type: work_table_1450x800
    pose:
      frame: cite_world
      xyz_m: [-0.075, 3.024, 0.000]
    hardware: {backend: sim}

  # Where the belt delivers. `b_accumulation` is a sink with no actor, so nothing
  # picks from this table and its surface is never a station point — it exists to
  # catch what runs off `transfer_belt`. Its near face stands at x = 1.935 against
  # the belt's end at 1.910: 25 mm of designed air, moved in from 50 mm at the
  # owner's request (2026-10-16). He asked for about 15 mm, which is under
  # geometric.MIN_CLEARANCE_M (20 mm); exactly 20 mm still warns, because the
  # difference of the two faces lands a hair under it in floating point. Its
  # surface, 0.550 m, is 85 mm below the belt's 0.635 m, which stands on a riser
  # (see model/assets/instances/conveyors.yaml).
  - id: outfeed_table
    zone: cell_b
    type: work_table_600
    pose:
      frame: cite_world
      xyz_m: [2.235, 3.060, 0.000]
    hardware: {backend: sim}

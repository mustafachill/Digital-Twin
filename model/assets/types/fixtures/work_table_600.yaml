---
# yaml-language-server: $schema=../../../schema/asset_type.schema.json
schema: cite/asset_type/v1

# A 0.6 m square work table; the name is its footprint, not its height. Its
# `surface` frame is where a source station presents work-pieces and where a
# sink station accumulates them.
#
# 0.570 m TALL since 2026-10-16, at the owner's request: its one instance,
# `outfeed_table`, catches what runs off the belt's end, and stands a little
# under the belt's surface so a part drops onto it rather than butting into it.
# It was 0.600 m while it was also the pick table; the pick table is now
# `work_table_1450x800`, which keeps 0.600 m.
asset_type:
  id: work_table_600
  category: fixture

  frames:
    - id: surface
      xyz_m: [0.000, 0.000, 0.570]

  description:
    provider: body
    body:
      # The VISUAL is a lab bench — a chamfered wooden top and wooden apron on
      # four orange steel legs with levelling feet — that
      # `python -m cite_tools.visuals --write` generates from the collision box
      # below (ADR-0079). Its top face is the box top, where `surface` lies. It
      # carries its own finishes, which is why this body names no `material`.
      # The COLLISION stays the solid box: conservative, and never the visual.
      visual:
        kind: mesh
        uri: file://$(find cite_description)/meshes/visual/tables/work_table_600.glb
      collision:
        kind: box
        size_m: [0.600, 0.600, 0.570]
      inertial:
        mass_kg: 30.0
        com_m: [0.0, 0.0, 0.0]
        # Solid box 0.6 x 0.6 x 0.57 at 30 kg:
        #   ixx = iyy = 30/12 * (0.36 + 0.3249) = 1.71225
        #   izz       = 30/12 * (0.36 + 0.36)   = 1.8
        ixx: 1.71225
        iyy: 1.71225
        izz: 1.8

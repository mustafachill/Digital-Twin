---
# yaml-language-server: $schema=../../../schema/asset_type.schema.json
schema: cite/asset_type/v1

# UFACTORY xArm 5 — the reference manipulator (charter §3.1).
#
# This entry is the whole of the generator's knowledge of `xarm_description`. The
# vendor description is *invoked*, never ingested: nothing here opens a vendor
# file, copies one, or patches one, so a vendor upgrade that renames a macro
# parameter is a two-line diff in this file rather than a change to code. That is
# the rule L1 left open for incorporating vendor descriptions.
asset_type:
  id: xarm5
  category: robot
  vendor: ufactory

  kinematics:
    dof: 5
    # The vendor's own joint names, verbatim. They are not reformatted: a
    # controller whose joint names differ from the description by one character
    # fails at runtime with an error naming the spawner, not the mismatch.
    joint_suffixes: [joint1, joint2, joint3, joint4, joint5]
    base_link_suffix: link_base
    tip_link_suffix: link_eef
    # UFACTORY specification. Used by the geometric validator to reject a station
    # whose pick or place point is beyond what the arm can actually reach.
    max_reach_m: 0.700

  frames:
    - id: base
      xyz_m: [0.0, 0.0, 0.0]
      link: link_base
    - id: tcp
      xyz_m: [0.0, 0.0, 0.0]
      link: link_tcp

  description:
    provider: xacro_macro
    package: xarm_description
    file: urdf/xarm_device_macro.xacro
    macro: xarm_device
    # Facts about the type — identical for every instance of it.
    fixed_args:
      robot_type: xarm
      dof: 5
      limited: false
      velocity_control: false
      effort_control: false
      model1300: false
      mesh_suffix: stl
      # We generate the mount link ourselves, so the vendor must not add one.
      create_attach_link: false
      # Suppressed deliberately: the vendor's plugin emission has no way to set
      # <ros><namespace>, and the controller manager must live under
      # /cite/<zone>/<asset_id>. The cell generator emits the plugin instead.
      load_gazebo_plugin: false
    # Macro parameter -> generator binding. A binding name the generator does not
    # know is an error, so a vendor rename fails loudly here instead of silently
    # producing a description with a default in it.
    bound_args:
      prefix: instance.prefix
      hw_ns: instance.id
      attach_to: instance.parent_link
      attach_xyz: instance.parent_xyz_m
      attach_rpy: instance.parent_rpy_rad
      ros2_control_plugin: instance.hardware.ros2_control_plugin
      add_gripper: instance.end_effector.vendor_integrated

  # The plugin class string exists exactly once, here. That is what makes
  # ADR-0005's "the only thing that differs is which plugin is loaded" true by
  # construction rather than by discipline.
  hardware_backends:
    sim:
      ros2_control_plugin: gz_ros2_control/GazeboSimSystem
      instance_params: []
    real:
      ros2_control_plugin: uf_robot_hardware/UFRobotSystemHardware
      # Phase 2. Declared now so that a mixed fleet is a data change.
      instance_params: [robot_ip, report_type]

  control:
    # Controller-manager rate. The vendor ships 150 Hz for the xArm, and this is
    # a fact about the robot rather than about the generator — it lived in
    # generate/control.py, where it was applied identically to every type the
    # generator would ever see, which is the P5 inversion ("code encodes how,
    # never which"). A controller loop that cannot hold this rate is a
    # performance finding, not a value to quietly lower.
    update_rate_hz: 150
    # Clamp every command against the joint's declared limits before writing it.
    #
    # This is a safety finding in its own right, not a detail of the gripper fix
    # that motivated it. `ros2_control` defaults this to false, it had never been
    # set, and the result was that NOTHING enforced any declared limit anywhere in
    # this cell — not for the gripper and not for the five arm joints, on either
    # path. The limits were all present and all inert: the vendor description
    # declares position, velocity and effort limits for every joint,
    # `cross-cutting-safety.md` requires limits enforced at planning *and* at
    # execution, and the generated MoveIt `joint_limits.yaml` states outright that
    # it is "the planning half, and the controller is the other". The other half
    # was not running.
    #
    # What it costs: the limiter now also clamps the five arm joints, so a
    # trajectory that asked for more than the description allows is followed as
    # far as the description allows instead of overshooting. That is the intended
    # behaviour, but it is a change to the arm's execution path and not only to
    # the gripper's — measured rather than assumed, see the fix report.
    enforce_command_limits: true

  controllers:
    # Stage 0 must be active before stage 1: the controllers below read the state
    # this broadcaster publishes. Expressing that as data rather than as a sleep
    # is what P4 requires of bring-up.
    - suffix: joint_state_broadcaster
      type: joint_state_broadcaster/JointStateBroadcaster
      joints: none
      stage: 0
    - suffix: joint_trajectory_controller
      type: joint_trajectory_controller/JointTrajectoryController
      joints: arm
      stage: 1
      command_interfaces: [position]
      state_interfaces: [position, velocity]

  planning:
    # The vendor's own SRDF group names, prefixed with the asset id exactly as
    # joints and controllers are: arm_1 plans with group arm_1_xarm5.
    group_suffix: xarm5
    end_effector_group_suffix: xarm_gripper
    # link_tcp rather than link_eef: with a gripper fitted the vendor's chain
    # continues to the tool centre point, and planning to the flange instead
    # would put the gripper's length quietly into every placement error.
    tip_link_suffix: link_tcp
    # The SRDF is invoked, not copied — same rule as the description. It carries
    # the self-collision matrix, which is a fact about the vendor's geometry.
    srdf_package: xarm_moveit_config
    srdf_file: srdf/xarm_macro.srdf.xacro
    srdf_macro: xarm_macro_srdf
    srdf_args:
      dof: 5
      robot_type: xarm
    kinematics_plugin: kdl_kinematics_plugin/KDLKinematicsPlugin
    kinematics_resolution: 0.005
    kinematics_timeout_s: 0.05
    # Conservative planning-time scaling. The arm's own limits are in the vendor
    # description; these are what MoveIt is allowed to ask for.
    max_velocity_scaling: 0.35
    max_acceleration_scaling: 0.35
    # Joint acceleration ceiling, rad/s^2. The vendor description carries
    # velocity and effort limits but no acceleration limit, and MoveIt's time
    # parameterisation needs one — without it the planner emits trajectories the
    # controller cannot track, which presents as following error rather than as
    # a missing limit. A ceiling is a property of THIS arm, so it is stated here
    # rather than as a constant in generate/moveit.py (P5).
    max_acceleration_rad_s2: 2.0

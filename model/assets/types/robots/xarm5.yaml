---
# yaml-language-server: $schema=../../../schema/asset_type.schema.json
schema: cite/asset_type/v1

# UFACTORY xArm 5 — the reference manipulator (charter §3.1).
#
# This entry is the whole of the generator's knowledge of `xarm_description`. The
# vendor description is *invoked*, never ingested: nothing here opens a vendor
# file, copies one, or patches one, so a vendor upgrade that renames a macro
# parameter is a two-line diff in this file rather than a change to code. That is
# the rule L1 left open for incorporating vendor descriptions.
asset_type:
  id: xarm5
  category: robot
  vendor: ufactory

  kinematics:
    dof: 5
    # The vendor's own joint names, verbatim. They are not reformatted: a
    # controller whose joint names differ from the description by one character
    # fails at runtime with an error naming the spawner, not the mismatch.
    joint_suffixes: [joint1, joint2, joint3, joint4, joint5]
    base_link_suffix: link_base
    tip_link_suffix: link_eef
    # UFACTORY specification. Used by the geometric validator to reject a station
    # whose pick or place point is beyond what the arm can actually reach.
    max_reach_m: 0.700

  frames:
    - id: base
      xyz_m: [0.0, 0.0, 0.0]
      link: link_base
    - id: tcp
      xyz_m: [0.0, 0.0, 0.0]
      link: link_tcp

  description:
    provider: xacro_macro
    package: xarm_description
    file: urdf/xarm_device_macro.xacro
    macro: xarm_device
    # Facts about the type — identical for every instance of it.
    fixed_args:
      robot_type: xarm
      dof: 5
      limited: false
      velocity_control: false
      effort_control: false
      model1300: false
      mesh_suffix: stl
      # We generate the mount link ourselves, so the vendor must not add one.
      create_attach_link: false
      # Suppressed deliberately: the vendor's plugin emission has no way to set
      # <ros><namespace>, and the controller manager must live under
      # /cite/<zone>/<asset_id>. The cell generator emits the plugin instead.
      load_gazebo_plugin: false
    # Macro parameter -> generator binding. A binding name the generator does not
    # know is an error, so a vendor rename fails loudly here instead of silently
    # producing a description with a default in it.
    bound_args:
      prefix: instance.prefix
      hw_ns: instance.id
      attach_to: instance.parent_link
      attach_xyz: instance.parent_xyz_m
      attach_rpy: instance.parent_rpy_rad
      ros2_control_plugin: instance.hardware.ros2_control_plugin
      add_gripper: instance.end_effector.vendor_integrated
      # The fitted end effector's declared close rate, handed to the vendor macro
      # so that it bounds the drive joint's velocity command interface — which is
      # the only route a limit has into the running system. A limit cannot live in
      # the controller configuration: controller_manager 4.45.2's
      # ResourceManager::import_joint_limiters passes null node interfaces, so no
      # `joint_limits.<joint>.*` key there is ever read, and
      # GripperActionController has no rate parameter. Limits come from the
      # description or they do not exist.
      #
      # The macro parameter this binds to arrives with
      # external/patches/02-xarm_ros2-gripper-drive-rate-parameter.patch; the
      # vendor hardcodes +/-3.14 rad/s. Read that patch's header before assuming
      # the physical gripper is bounded too — it is not, and the header says why.
      gripper_max_drive_rate_rad_s: instance.end_effector.max_drive_rate_rad_s

    # What this description's links actually collide against (ADR-0028).
    #
    # WHY THIS BLOCK EXISTS AT ALL. A vendor description is invoked, never
    # ingested, so nothing in the generator or the validators may open a vendor
    # file to find out. The consequence was not a missing check but a silent one:
    # `validate.physical._collision_is_not_a_visual_mesh` — documented in its own
    # docstring as "the single most consequential rule in L1" — reads
    # `description.body`, every vendor-described type leaves `body` unset, and so
    # the rule returned an empty list for exactly the links where the failure it
    # names occurs. It had been passing on this type for as long as it existed.
    # This block is what it now reads.
    #
    # WHAT THE VENDOR ACTUALLY DOES, which is why `vendor_meshes` is a real
    # answer and not a placeholder. `xarm5.urdf.xacro` takes its `unless` branch
    # for this variant (`model1300: false` and `mesh_suffix: stl` put `model_num`
    # at -1), and that branch sets `collision_dir` to `xarm5/visual`. The gripper
    # does the same unconditionally, passing one `mesh_filename` to both
    # `common_link_visual` and `common_link_collision` on all seven of its links.
    # Twelve links per arm therefore collide against a rendering mesh.
    collision:
      # THE SHIPPED DEFAULT IS THE VENDOR'S MESHES, DELIBERATELY, AND MOVING IT
      # IS NOT A ONE-LINE CHANGE OF THIS VALUE.
      #
      # ADR-0028's amended promotion gate requires the friction-grasp campaign
      # (docs/measurements/2026-08-25-friction-grasp/) re-run against hull
      # geometry before hulls may be selected. The campaign that motivated hulls
      # measured what they COST and never measured what they BREAK, and the
      # record's own warning is about this cell's grasp: the pads hold a part by
      # friction alone (ADR-0029), so the contact surface IS the mechanism, and a
      # convex hull fills the space between the fingers. Selecting `convex_hull`
      # here without that measurement would replace a working, measured line with
      # an unmeasured geometry.
      select: vendor_meshes
      # The vendor macro parameter that carries a collision-mesh root. Named here
      # rather than in the generator for the same reason every entry in
      # `bound_args` is: it is a fact about xarm_description, and a vendor rename
      # should be a one-line model diff. It arrives with
      # external/patches/03-xarm_ros2-collision-mesh-root.patch; read that
      # patch's header before assuming the vendor offers it.
      root_arg: collision_mesh_path
      sets:
        - id: vendor_meshes
          kind: vendor_meshes
        - id: convex_hull
          kind: convex_hull
          # Where the derived meshes are installed. `cite_description` is the L1
          # package that installs `assets/meshes` into its share directory, so
          # this root and the vendor's differ only in which package they name.
          package: cite_description
          root: meshes/collision/xarm5/convex_hull
          source_package: xarm_description
          source_root: meshes
          # EXHAUSTIVE, and it has to be. The binding replaces the collision mesh
          # ROOT, so every collision reference in the expanded description
          # resolves under the new root — a mesh missing from this list is a
          # collision shape that resolves to nothing. These thirteen are the
          # complete set, read off the expanded `cell_a_arm_1.urdf.xacro` rather
          # than off the vendor's source: five arm links, one end-tool proxy on
          # `link5`, and seven gripper links.
          #
          # `end_tool/collision/end_tool.stl` is the one entry that is NOT a
          # rendering mesh — it is the vendor's own 260-triangle collision proxy —
          # and it is hulled anyway, because the root substitution is wholesale
          # and a copy of the vendor's file into our tree would be vendored
          # third-party source (ADR-0008).
          #
          # `xarm5/visual/link5.stl` is deliberately absent: it is a VISUAL mesh
          # only. The vendor's `link5_collision` points at the end tool instead.
          meshes:
            - xarm5/visual/link_base.stl
            - xarm5/visual/link1.stl
            - xarm5/visual/link2.stl
            - xarm5/visual/link3.stl
            - xarm5/visual/link4.stl
            - end_tool/collision/end_tool.stl
            - gripper/xarm/base_link.stl
            - gripper/xarm/left_outer_knuckle.stl
            - gripper/xarm/left_finger.stl
            - gripper/xarm/left_inner_knuckle.stl
            - gripper/xarm/right_outer_knuckle.stl
            - gripper/xarm/right_finger.stl
            - gripper/xarm/right_inner_knuckle.stl

  # The plugin class string is authored exactly once, here. That is what makes
  # ADR-0005's "the only thing that differs is which plugin is loaded" true by
  # construction rather than by discipline. One test mirrors the value in order to
  # assert against it rather than to supply it; `HardwareBackend` in
  # tools/cite_tools/model/schema.py states that exception and its limit.
  hardware_backends:
    sim:
      ros2_control_plugin: gz_ros2_control/GazeboSimSystem
      instance_params: []
    real:
      ros2_control_plugin: uf_robot_hardware/UFRobotSystemHardware
      # Phase 2. Declared now so that a mixed fleet is a data change.
      instance_params: [robot_ip, report_type]

  control:
    # Controller-manager rate. The vendor ships 150 Hz for the xArm, and this is
    # a fact about the robot rather than about the generator — it lived in
    # generate/control.py, where it was applied identically to every type the
    # generator would ever see, which is the P5 inversion ("code encodes how,
    # never which"). A controller loop that cannot hold this rate is a
    # performance finding, not a value to quietly lower.
    update_rate_hz: 150
    # Clamp every command against the joint's declared limits before writing it.
    #
    # This is a safety finding in its own right, not a detail of the gripper fix
    # that motivated it. `ros2_control` defaults this to false, it had never been
    # set, and the result was that NOTHING enforced any declared limit anywhere in
    # this cell — not for the gripper and not for the five arm joints, on either
    # path. The limits were all present and all inert: the vendor description
    # declares position, velocity and effort limits for every joint,
    # `cross-cutting-safety.md` requires limits enforced at planning *and* at
    # execution, and the generated MoveIt `joint_limits.yaml` states outright that
    # it is "the planning half, and the controller is the other". The other half
    # was not running.
    #
    # What it costs: the limiter now also clamps the five arm joints, so a
    # trajectory that asked for more than the description allows is followed as
    # far as the description allows instead of overshooting. That is the intended
    # behaviour, but it is a change to the arm's execution path and not only to
    # the gripper's — measured rather than assumed, see the fix report.
    enforce_command_limits: true

  controllers:
    # Stage 0 must be active before stage 1: the controllers below read the state
    # this broadcaster publishes. Expressing that as data rather than as a sleep
    # is what P4 requires of bring-up.
    - suffix: joint_state_broadcaster
      type: joint_state_broadcaster/JointStateBroadcaster
      joints: none
      stage: 0
    - suffix: joint_trajectory_controller
      type: joint_trajectory_controller/JointTrajectoryController
      joints: arm
      stage: 1
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      # When this arm should call a trajectory mistracked (ADR-0036).
      #
      # THE GAP THESE CLOSE. Without a `constraints:` block
      # `joint_trajectory_controller` defaults every tolerance to 0.0, and 0.0
      # DISABLES the check — `check_state_tolerance_per_joint` skips any variable
      # whose tolerance is not `> 0.0`. So a trajectory that clipped a conveyor
      # ran to the end, reported SUCCEEDED, and `Pick` reported a pick it never
      # made. Nothing else in this repository observed the difference: the
      # scenario containment check bounds the WORK-PIECE, not the arm.
      #
      # They are a detector and not a protective measure. What stops this arm
      # driving into a fixture is UFACTORY's torque limiting and physical
      # guarding (charter §3.2). These convert a silent success into an
      # EXECUTION_FAILED that L4 can fault a station on, after the fact.
      #
      # PROVENANCE, and this is the part to read before trusting a number.
      # All four are UFACTORY's own values for the xArm 5, copied from
      # `xarm_controller/config/xarm5_controllers.yaml` at the commit
      # `external/cite.repos` pins. They are the vendor's numbers for the
      # vendor's arm — the same class of provenance as `max_reach_m` above — and
      # they are NOT a measurement taken on this stack. No healthy-run following
      # error was sampled before choosing them, because that is only observable
      # under Gazebo and the change that introduced them was not permitted to run
      # a scenario. ADR-0036 records the campaign that replaces them.
      #
      # One step weaker than that, and the difference is not cosmetic: the vendor
      # block was written for a controller declaring
      # `command_interfaces: [position, velocity]`, and the block below is
      # attached to one declaring `[position]`. Same arm, different control mode.
      # The three POSITION tolerances transfer, because both configurations track
      # position; `stopped_velocity_tolerance_rad_s` does not, and its own comment
      # says why.
      constraints:
        # Seconds after the trajectory's end time to keep waiting for
        # `goal_tolerance_rad`. Never 0.0: at zero the controller waits forever
        # rather than failing, turning a missed goal into a hang. The schema
        # refuses zero, so that combination cannot be written here.
        goal_time_s: 0.5
        # Radians of per-joint position error allowed at the goal. ~0.57°.
        goal_tolerance_rad: 0.01
        # Radians of per-joint position error allowed WHILE MOVING. ~57°, which
        # is deliberately enormous, and the size is the decision rather than an
        # oversight.
        #
        # This is the only one of the three that catches a clipped fixture
        # mid-motion, and it is also the only one evaluated on every cycle of
        # every motion — so it is the one that can cry wolf, and a flake here
        # lands on `./scripts/scenario pick_and_place`, which is a BLOCKING CI
        # gate. At 1.0 rad it fires when a joint is held back hard enough to
        # accumulate 57° of error, which is a stall, not a loaded machine.
        #
        # State plainly what that buys and what it does not: it detects a joint
        # that is being HELD, and it does not detect a graze that deflects the
        # arm and lets it continue. That case remains invisible, exactly as it is
        # today, and closing it needs a scene-aware monitor rather than a smaller
        # number here.
        #
        # If this ever fires on a healthy run, set it to `null` — which disables
        # the path check and keeps the goal check — rather than widening it. A
        # tolerance wide enough never to fire is not a detector.
        trajectory_tolerance_rad: 1.0
        # rad/s below which a joint counts as stopped at the goal. 0.0 disables
        # the check, and disabling it is the decision.
        #
        # THIS CHECK CANNOT FIRE ON THIS CELL AT ALL, whatever value stands here
        # and whatever `goal_time_s` is, and the reason is the `command_interfaces`
        # list twelve lines above. `get_segment_tolerances` does assign this to the
        # goal state's velocity unconditionally, and upstream does default it to
        # 0.01 rather than to zero — but `compute_error_for_joint` writes a
        # velocity error only when `has_velocity_state_interface_ &&
        # (has_velocity_command_interface_ || has_effort_command_interface_)`.
        # This controller commands POSITION ONLY, so `state_error_.velocities`
        # stays at the zeros it was sized to and `abs(0.0) > tolerance` is never
        # true. An earlier version of this comment claimed the opposite; see
        # ADR-0036's 2026-08-27 correction.
        #
        # Stating the vendor's explicit 0.0 anyway costs nothing and pre-empts the
        # one change that would arm it. WHAT WOULD ARM IT is adding a `velocity`
        # or an `effort` entry to `command_interfaces` above — nothing else does,
        # and that is not hypothetical: UFACTORY's own xarm5_controllers.yaml
        # commands `[position, velocity]`, so adopting the vendor's interface set
        # makes this parameter live on the first run afterwards. Whoever makes
        # that change owns deciding this number, because 0.01 would then start
        # aborting a joint that settles a little late — a velocity flake in a
        # block whose whole purpose is to detect a position error.
        stopped_velocity_tolerance_rad_s: 0.0

  planning:
    # The vendor's own SRDF group names, prefixed with the asset id exactly as
    # joints and controllers are: arm_1 plans with group arm_1_xarm5.
    group_suffix: xarm5
    end_effector_group_suffix: xarm_gripper
    # link_tcp rather than link_eef: with a gripper fitted the vendor's chain
    # continues to the tool centre point, and planning to the flange instead
    # would put the gripper's length quietly into every placement error.
    tip_link_suffix: link_tcp
    # The SRDF is invoked, not copied — same rule as the description. It carries
    # the self-collision matrix, which is a fact about the vendor's geometry.
    srdf_package: xarm_moveit_config
    srdf_file: srdf/xarm_macro.srdf.xacro
    srdf_macro: xarm_macro_srdf
    srdf_args:
      dof: 5
      robot_type: xarm
    kinematics_plugin: kdl_kinematics_plugin/KDLKinematicsPlugin
    kinematics_resolution: 0.005
    kinematics_timeout_s: 0.05
    # Conservative planning-time scaling. The arm's own limits are in the vendor
    # description; these are what MoveIt is allowed to ask for.
    max_velocity_scaling: 0.35
    max_acceleration_scaling: 0.35
    # Joint acceleration ceiling, rad/s^2. The vendor description carries
    # velocity and effort limits but no acceleration limit, and MoveIt's time
    # parameterisation needs one — without it the planner emits trajectories the
    # controller cannot track, which presents as following error rather than as
    # a missing limit. A ceiling is a property of THIS arm, so it is stated here
    # rather than as a constant in generate/moveit.py (P5).
    max_acceleration_rad_s2: 2.0
    # Braking ceiling, rad/s^2, as a magnitude. Pilz's trapezoidal profile treats
    # braking separately from accelerating (ADR-0027).
    #
    # What this key is NOT for, because the comment here used to say it was:
    # omitting it would not make Pilz refuse every request. MoveIt derives the
    # ceiling when it is missing — `joint_limits_aggregator.cpp` sets
    # `max_deceleration = -max_acceleration` whenever an acceleration limit is
    # present and a deceleration limit is not — and this type already declares
    # one above, so the derived value would have been -2.0, which is exactly what
    # the generator now emits. The refusal that comment described needs the
    # acceleration ceiling to be absent too.
    #
    # It is stated anyway so that the braking ceiling is a decision about this
    # arm rather than an accident of its acceleration ceiling: derived, the two
    # can never differ, and an arm that has to brake harder than it accelerates
    # would have nowhere to say so. Equal to the acceleration ceiling because
    # nothing about this arm makes it brake harder; MoveIt's negative sign
    # convention is applied by the template, not written here.
    max_deceleration_rad_s2: 2.0

    # ADR-0027. Pilz is a trajectory generator rather than a search: PTP is a
    # computation on the joint limits above, so the same request produces the
    # same trajectory and a failure can be bisected. OMPL is kept as the fallback
    # for the motions a point-to-point interpolation cannot make.
    #
    # Which pipeline plans is data because it is a claim about THIS arm. The
    # generator knows what each pipeline is made of — plugin class, adapter chain
    # — and rejects a name it does not know, which is the P5 split: the model
    # chooses, the generator configures.
    default_pipeline: pilz_industrial_motion_planner
    # Pilz refuses a request with an empty planner id, so PTP is named. LIN is
    # configured and loadable but is NOT the default: a straight Cartesian path
    # needs the full 6-DOF pose reachable along its whole length, and this arm
    # has five degrees of freedom (ADR-0026). That is not left to a comment — the
    # generator refuses a Cartesian planner as an arm's DEFAULT when its planning
    # group has fewer than six joints, and refuses an id the pipeline does not
    # register at all, so a typo or an empty string fails validation rather than
    # at the first request.
    default_planner_id: PTP
    fallback_pipeline: ompl
    # Empty: the OMPL block the generator emits declares one planner
    # configuration, so "the pipeline's own default" is unambiguous — and it is
    # the planner every motion in this cell used before ADR-0027, which makes the
    # fallback path the behaviour this cell already had rather than a new one.
    fallback_planner_id: ""

    # Task-space ceilings, read by the pipelines that interpolate in Cartesian
    # space (Pilz LIN and CIRC). They exist because that pipeline cannot be
    # constructed without all four — its parameter listener declares them with no
    # defaults — and NO motion in this cell consumes them today: every motion is
    # planned in joint space (ADR-0026, ADR-0027).
    #
    # Conservative placeholders, and this comment overreached in two ways until
    # it was corrected.
    #
    #   * The three translational figures are ours and sit well under MoveIt's
    #     own template values (1.0, 2.25, -5.0). The rotational one, 1.57, is
    #     MoveIt's template default byte for byte — it was never chosen for this
    #     arm, and describing all four as chosen made a copied number look like a
    #     measurement.
    #   * "Never the thing that makes a joint exceed its own" cannot hold for any
    #     positive value. The joint rate a tool velocity requires is `J^-1
    #     x_dot`, which grows without bound as the arm approaches a singularity,
    #     so there is always a pose at which the joint ceiling binds first. What
    #     actually keeps the joints inside their limits is Pilz's per-sample
    #     joint check, not these numbers.
    #
    # Read them as: low enough not to be the interesting constraint, present so
    # the pipeline loads, and to be replaced by a measurement on the day a
    # Cartesian planner is actually asked for a motion.
    max_cartesian_velocity_m_s: 0.25
    max_cartesian_acceleration_m_s2: 0.5
    max_cartesian_deceleration_m_s2: 0.5
    max_cartesian_rotational_velocity_rad_s: 1.57

---
# yaml-language-server: $schema=../../../schema/asset_type.schema.json
schema: cite/asset_type/v1

# A through-beam presence sensor across a conveyor.
#
# It is what makes the line sensor-driven rather than timed: a station acts
# because a work-piece was detected, never because a duration elapsed.
asset_type:
  id: break_beam
  category: sensor

  frames:
    - id: beam
      xyz_m: [0.0, 0.0, 0.0]

  description:
    provider: body
    body:
      visual:
        kind: box
        size_m: [0.040, 0.040, 0.120]
      collision:
        kind: box
        size_m: [0.040, 0.040, 0.120]
      inertial:
        mass_kg: 0.25
        # Solid box 0.04 x 0.04 x 0.12 at 0.25 kg:
        #   ixx = izz(y) = 0.25/12 * (0.0016 + 0.0144) = 3.3333e-4
        #   iyy         = 0.25/12 * (0.0016 + 0.0144) = 3.3333e-4
        #   izz         = 0.25/12 * (0.0016 + 0.0016) = 6.6667e-5
        ixx: 0.00033333
        iyy: 0.00033333
        izz: 0.00006667
      material: sensor_housing

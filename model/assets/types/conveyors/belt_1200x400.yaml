---
# yaml-language-server: $schema=../../../schema/asset_type.schema.json
schema: cite/asset_type/v1

# A 1.2 m belt conveyor, ours rather than a vendor's.
#
# The infeed and outfeed frames are the reason this type exists: the coordinate
# of a belt's end is written once, here, and every station that reaches for it
# references `<asset_id>/infeed` or `<asset_id>/outfeed`. In v1 those coordinates
# were copied into a second configuration file and diverged, which is the defect
# ADR-0004 exists to make impossible.
asset_type:
  id: belt_1200x400
  category: conveyor

  # All three frames lie on the belt's top face, 0.600 m up. An authored body's
  # pose names the point it stands on, so the body below has to be 0.600 m TALL
  # for these to describe the same object — a 0.100 m slab standing on the floor
  # would put the declared work surface half a metre above the geometry, and a
  # PlaceAt would release the work-piece into empty air. `frame-outside-geometry`
  # in cite_tools.validate.geometric now rejects that arrangement mechanically.
  frames:
    - id: surface
      xyz_m: [0.000, 0.000, 0.600]
    - id: infeed
      xyz_m: [-0.600, 0.000, 0.600]
    - id: outfeed
      xyz_m: [0.600, 0.000, 0.600]

  description:
    provider: body
    body:
      # Visual and collision are separate fields with no default linking them.
      # Here they happen to be the same primitive, which is fine — the point is
      # that reusing a dense visual mesh as collision geometry has to be a
      # visible choice, never an omission (L1).
      #
      # A real belt conveyor is a stand carrying a belt, so most of this box is
      # air. The cost is stated rather than hidden: as a VISUAL it reads as a
      # solid block, and as COLLISION it is conservative — the planner will
      # refuse a path under the belt that a real gripper could take. Both are
      # deliberate. A single primitive is what `Body` can express, and an
      # optimistic collision hull is the failure that puts a gripper through a
      # conveyor frame at run time.
      visual:
        kind: box
        size_m: [1.200, 0.400, 0.600]
      collision:
        kind: box
        size_m: [1.200, 0.400, 0.600]
      inertial:
        # A steel-framed belt of this size. Plausible rather than measured, and
        # the physical validator checks it is at least self-consistent. 45 kg
        # over the 0.288 m^3 bounding box is 156 kg/m^3, which is what a mostly
        # hollow frame should read as.
        mass_kg: 45.0
        # Relative to the CENTRE of the collision box, which is the reference
        # `Inertial.com_m` fixes and which the scene template and
        # `validate.physical` both use. Zero here means the tensor below is
        # centroidal, as every tensor in this model is.
        com_m: [0.0, 0.0, 0.0]
        # Solid-box tensor for 1.2 x 0.4 x 0.6 m at 45 kg:
        #   ixx = m/12 * (y^2 + z^2) = 45/12 * (0.16 + 0.36) = 1.95
        #   iyy = m/12 * (x^2 + z^2) = 45/12 * (1.44 + 0.36) = 6.75
        #   izz = m/12 * (x^2 + y^2) = 45/12 * (1.44 + 0.16) = 6.00
        ixx: 1.9500
        iyy: 6.7500
        izz: 6.0000
      material: conveyor_frame

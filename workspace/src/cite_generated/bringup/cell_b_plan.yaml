---
# GENERATED by cite-model. DO NOT EDIT.
# Source:     model/
# Regenerate: ./scripts/validate-model --write
# A hand edit here is a Critical review finding (ADR-0004) and is detected by
# ./scripts/validate-model, which diffs this tree against a fresh generator run.
#
# The bring-up plan: what to start, in what order, and what each node needs to
# know. It is data rather than generated Python on purpose (P5) — the launch
# mechanism in cite_bringup is written once, reviewed once, and tested once;
# adding a fourth arm changes this list, not that code.
#
# `stage` expresses dependency, not time. The launch mechanism gates each stage
# on the previous one reporting success, never on a duration (P4).
plan:
  zone: cell_b
  world: package://cite_generated/worlds/cell_b.sdf
  # Where a windowed run's camera starts. Read only when Gazebo opens a window.
  gui_config: package://cite_generated/worlds/cell_b_gui.config
  scene: package://cite_generated/description/cell_b_scene.urdf.xacro
  static_frames: package://cite_generated/frames/cell_b_static_tf.yaml
  topology: package://cite_generated/topology/cell_b_flow.yaml

  # How wide the parts this facility handles are, as one interval.
  #
  # A FACILITY FACT, stated once per zone beside the other one-per-zone
  # statements above, and deliberately NOT on any controller manager's gripper
  # block (ADR-0052 A.4). Every key there is sourced from the END-EFFECTOR type;
  # a work-piece width is not a property of an end effector, and putting it on a
  # tuple named for the gripper is how a name stops meaning anything.
  #
  # WHAT READS IT. `cite_skills::gripper_is_holding` judges a stall against this
  # interval rather than against the width that was commanded (ADR-0052, option
  # F). The command is a policy value; the error the predicate makes is about
  # where the PART is, and both directions of that error are measured. The
  # bring-up mechanism passes the pair to every skill server, the way it passes
  # the gripper keys.
  #
  # THE INTERVAL AND NEVER WHICH PART. `Pick.Goal.workpiece_id` is an instance id
  # minted by L4's registry and there is no map from one to an L0 work-piece type
  # anywhere in this repository, so nothing can tell L3 which part is in the
  # jaws. The interval keeps L3 knowing only the RANGE of widths this facility
  # handles, which is a fact about the facility and not about the goal - so
  # adding a second part changes data and not code (P5, P9). Its cost is that the
  # window widens with the declared spread; `stall-band-admits-a-stall-on-nothing`
  # in cite_tools.validate.physical is what fires when that stops discriminating,
  # and ADR-0052 A.5 is what to reopen when it does.
  #
  # On a facility declaring one part the interval is degenerate and both numbers
  # are the same. That is today's model, and it is not a special case in anything
  # that reads this.
  workpieces:
    narrowest_width_m: 0.066
    widest_width_m: 0.066
    # Each declared part's box and mass, for whatever spawns one into a running
    # world. Read from here rather than restated beside the spawn (ADR-0067).
    models:
      - {name: workpiece, size_m: [0.066, 0.066, 0.066], mass_kg: 0.2}

  # The sides this zone runs, and the Gazebo transport partition each one runs
  # in. One side on an untwinned zone; two where the zone declares
  # `twin.sides: pair` (ADR-0041).
  #
  # `ROS_DOMAIN_ID` does not isolate Gazebo transport, and that was MEASURED
  # rather than suspected: two `gz sim` servers in one container on separate ROS
  # domains produced two publishers on one world's stats topic and two
  # subscribers on one belt's command topic, so a single conveyor setpoint would
  # have started both cells' belts with nothing logged. What kept the measured
  # pairs apart was the container hostname, which gz-transport derives its
  # default partition from — an accident of one deployment, invisible at runtime,
  # and gone the moment two sides share a container or a network namespace
  # (ADR-0042).
  #
  # Emitted here rather than computed at launch because a partition is a NAME, in
  # the same class as every other name this plan carries: emitting it means a
  # reviewer sees it in a diff and ./scripts/validate-model checks it. Bring-up
  # refuses to start a side whose process environment does not carry the value
  # named here — never a warning, because what it guards against produces no
  # symptom.
  #
  # A developer attaching `gz topic -e` to a running side must set the same
  # GZ_PARTITION or the topic list comes back empty rather than wrong.
  #
  # `domain_offset` is the OTHER isolation, and it is the other half of one rule:
  # a process belonging to a side carries both, resolved from the same side
  # identity and read from this one block. GZ_PARTITION does not isolate the ROS
  # graph — move_group, the controller managers, the skill servers and the L4
  # coordinator speak DDS and have never heard of it — and ROS_DOMAIN_ID was
  # measured not to isolate the Gazebo transport. A pair carrying one and not the
  # other is either two cells sharing every belt topic or two cells colliding on
  # every node name, since both sides carry byte-identical names by rule
  # (ADR-0044, clauses 1 and 2).
  #
  # An OFFSET and never an absolute domain. A domain id is a host-scoped resource
  # allocation rather than a name, and the two ways an absolute one could be
  # derived both fail: from the deployment it differs in every clone, so
  # ./scripts/validate-model — which requires a fresh run to be byte-identical to
  # this file — would fail in every checkout but the one that wrote it; from the
  # model it is the same everywhere, so two checkouts of one commit resolve the
  # same domain and discover each other. The base travels on its own channel,
  # CITE_DOMAIN_BASE, and cite_bringup resolves base + offset in one place
  # (ADR-0044, clause 4).
  #
  # Emitted rather than left implicit in this list's order, for the reason the
  # partition is: positional meaning is not reviewable.
  sides:
    - name: plant
      gz_partition: cite/cell_b/plant
      domain_offset: 0
    - name: counterpart
      gz_partition: cite/cell_b/counterpart
      domain_offset: 1

  # The twin boundary's timing, from the zone's `twin:` block (ADR-0070 item 5).
  # `heartbeat_period_s` is how often the boundary tells each side it is alive;
  # a physical side's deadman times out on several of them. `state_max_age_s`,
  # where a side is physical, is the oldest joint, controller or deadman state
  # the boundary counts as current before a mode may command that side - the
  # same number that side's relays apply to the deadman's state.
  twin:
    heartbeat_period_s: 0.1
    state_max_age_s: 0.25

  controller_managers:
    - asset: picker
      node: /cite/cell_b/picker/controller_manager
      backend: sim
      # Whether that backend reaches a physical machine, as the asset's TYPE
      # declares it beside the plugin string it names. This and not `backend` is
      # what the hardware opt-in decides on (ADR-0054).
      commands_physical_hardware: false
      # What the counterpart side of this asset loads. Present only on a paired
      # zone, and carrying the fallback already applied: an instance that writes
      # no `counterpart_backend` in L0 loads the same plugin on both sides, so
      # this states the backend of a side that exists rather than repeating a key
      # the model left out (ADR-0041, Decision 3). The hardware opt-in reads
      # every side's backend, so a physical counterpart refuses to start without
      # it exactly as a physical plant would.
      counterpart_backend: real
      # The same fact for that side, emitted exactly where its backend is, so the
      # two accessors can never disagree about which sides this manager declares.
      # The reader refuses a document stating one without the other (ADR-0054).
      counterpart_commands_physical_hardware: true
      # The counterpart loads a backend other than the plant's, so it loads its
      # own description and controller configuration (ADR-0048 clause 2,
      # ADR-0070). Every name in them is the plant's: what differs is the
      # hardware behind the names. Absent where the two sides load one backend,
      # and then the counterpart loads `description` and `parameters` below.
      counterpart_description: package://cite_generated/description/counterpart/cell_b_picker.urdf.xacro
      counterpart_parameters: package://cite_generated/control/counterpart/cell_b_picker_controllers.yaml
      # What the counterpart's description reads from the ENVIRONMENT at launch:
      # xacro argument -> variable, and what kind of value it is. The plan names
      # the variable and never holds its value (ADR-0070 item 2). The physical
      # side's launch resolves it through `cite_bringup.plan.resolve_description_args`,
      # which refuses an unset variable and checks the value by its kind.
      counterpart_description_args:
        robot_ip: {env: CITE_XARM_IP, kind: ip_address}
      description_topic: /cite/cell_b/picker/robot_description
      joint_state_topic: /cite/cell_b/picker/joint_states
      description: package://cite_generated/description/cell_b_picker.urdf.xacro
      # Where this model is placed in the world. Stated here rather than inside
      # the description, so the description says what the arm IS and the model
      # says where it stands (L1).
      spawn_xyz_m: "-0.3 3.3 0.71"
      spawn_rpy_rad: "0 0 -1.57079633"
      parameters: package://cite_generated/control/cell_b_picker_controllers.yaml
      trajectory_action: /cite/cell_b/picker/picker_joint_trajectory_controller/follow_joint_trajectory
      gripper_action: /cite/cell_b/picker/picker_gripper_controller/gripper_cmd
      # The gripper's drive joint travels between these two values in its OWN
      # units. The skill server maps a task-space width onto it; without the
      # mapping a width in metres would be commanded as an angle.
      gripper_open_position: 0.0
      gripper_closed_position: 0.85
      # The linkage that converts between the two, and that places the pads on
      # the tool axis, as seven dimensions of the end effector rather than as two
      # fitted curves:
      #   opening(q) = 2*(drive_pivot_y - pad_inset
      #                   + finger_offset_y*cos(q) - finger_offset_z*sin(q))
      #   pad_plane_offset(q) = tip_link_z - drive_pivot_z - pad_face_centre_z
      #                         - (finger_offset_y*sin(q)
      #                            + finger_offset_z*cos(q))
      # The widest opening is derived from these, never carried alongside them —
      # a declared maximum is a second place for one fact to be stated, and the
      # one it used to state (85 mm, against a true 88.93 mm) was wrong. The
      # axial map's constant term, 0.0718988 m, is derived for the same reason.
      #
      # `pad_plane_offset` is why L3 can be given an object's pose rather than a
      # tool pose: the planning tip link is the FINGERTIP plane and the pads grip
      # with their faces, so a skill that planned straight to an object's pose
      # held it that far off centre. Measured at 24.4 mm, and measured to cause
      # every work-piece rotation above 20 degrees
      # (docs/measurements/2026-08-25-grasp-plane-offset/).
      gripper_drive_pivot_y_m: 0.035
      gripper_drive_pivot_z_m: 0.059098
      gripper_finger_offset_y_m: 0.035465
      gripper_finger_offset_z_m: 0.042039
      gripper_pad_inset_m: 0.026
      gripper_tip_link_z_m: 0.172
      gripper_pad_face_centre_z_m: 0.041003
      # The gripper controller's own goal tolerance, delivered to L3 because the
      # skill server needs it to judge a grasp: the controller ends a goal as soon
      # as |error| < goal_tolerance, so the position it reports is systematically
      # short of the command, and that bias has to be exceeded before a width
      # margin means anything. Same number the controller is configured with.
      gripper_goal_tolerance_rad: 0.01
      # The arm trajectory controller's own goal tolerance, delivered to L3 for
      # the same reason the gripper's is: ADR-0037 classifies a failed execution
      # by comparing the arm's joint state against the plan's first and last
      # points, and the threshold that comparison uses has to be the one the
      # controller itself checks against. Same number the controller is
      # configured with, from the same L0 `constraints:` block (ADR-0036).
      arm_goal_tolerance_rad: 0.01
      # How fast the drive joint may travel, rad/s, in either direction. Carried
      # to L3 for the same reason `gripper_goal_tolerance_rad` is: a skill that
      # waits for a grasp has to know how long the stroke can legitimately take
      # before a timeout means anything, and deriving that from a hardcoded guess
      # would put the gripper's speed in a second place.
      #
      # It is also the value the Phase 2 hardware bring-up must convert. The
      # physical gripper is not a `ros2_control` joint at all — `uf_robot_hardware`
      # exports interfaces for joint1..5 only and drives the gripper through
      # `xarm_api`'s service layer, whose speed argument is in motor r/min. The
      # declaration transfers; the mechanism does not. See the fix report.
      gripper_max_drive_rate_rad_s: 1.0
      # How long L3 waits for this gripper's controller to answer a GripperCommand
      # at all, in seconds of the skill server's OWN clock — simulation time in
      # this cell, the wall clock on hardware, and in both cases the clock the
      # controller's stall timer counts in (ADR-0045).
      #
      # It does not bound a slow grasp and cannot: the controller restarts its
      # stall search on every cycle above `stall_velocity_threshold`, so that
      # duration has no upper bound. An expiry says the controller never answered
      # and says NOTHING about whether the jaws hold a part — L3 cancels the goal
      # and reports custody as unestablished rather than reporting an empty
      # gripper. Its floor is derived from the stroke and `stall_timeout` in
      # cite_tools.validate.physical.
      gripper_result_timeout_s: 20.0
      # What a Pick closes to when its goal names no width. Narrower than the
      # work-piece on purpose: a parallel gripper evidences a grasp by failing to
      # reach where it was sent, so a width equal to the part teaches the skill
      # nothing (ADR-0022). Its ceiling is derived and enforced in
      # cite_tools.validate.physical.
      gripper_default_grasp_width_m: 0.060915
      # How far either side of a declared part's width a genuine stall on that
      # part may land and still be a grasp (ADR-0052 option F). The predicate
      # used to ask "did the jaws stop wider than we ASKED?"; it now asks "did
      # they stop where a part this facility handles would stop them?".
      #
      # PROVISIONAL, and the L0 comment carries the provenance rather than this
      # one: the narrow edge is the midpoint of a measured interval and the wide
      # edge has no measurement behind it at all. One declaration serves both
      # sides of a twin (P2, ADR-0041) - a per-backend band would be two
      # predicates wearing one name.
      gripper_stall_band_narrow_m: 0.002385
      gripper_stall_band_wide_m: 0.002385
      # The L3 actions this arm's skill server advertises. L4 read these as
      # parallel parameter arrays supplied by whoever launched the coordinator,
      # which is an asset name assembled outside the model — the one thing
      # CLAUDE.md §8 forbids. They are generated by `ids.py` here instead, so
      # what the server advertises and what the coordinator calls are one
      # statement.
      skills:
        move_to: /cite/cell_b/picker/move_to
        pick: /cite/cell_b/picker/pick
        place: /cite/cell_b/picker/place
        grasp: /cite/cell_b/picker/grasp
        transfer: /cite/cell_b/picker/transfer
      # The linear track this arm rides (ADR-0067). Its joint is in this arm's
      # description and its controller in this arm's controller manager. A
      # program commands it on `command_topic`, the controller's own
      # `joint_trajectory` input, so that the twin boundary forwards one command
      # to both sides as it forwards a belt setpoint, and reads arrival within
      # `goal_tolerance_m` on this arm's joint states.
      track:
        asset: picker_track
        joint: picker_track_joint
        controller: picker_track_trajectory_controller
        command_topic: /cite/cell_b/picker/picker_track_trajectory_controller/joint_trajectory
        stroke_m: 0.7
        max_speed_mps: 1.0
        goal_tolerance_m: 0.001
      controllers:
        - {name: picker_joint_state_broadcaster, stage: 0}
        - {name: picker_gripper_controller, stage: 1}
        - {name: picker_joint_trajectory_controller, stage: 1}
        - {name: picker_track_trajectory_controller, stage: 1}
      # What the counterpart's OWN configuration defines, stated exactly where
      # `counterpart_parameters` is. A side spawns the controllers its own file
      # defines and no other: one whose joint no hardware on that side exports
      # is absent there, and its names are served by something else (ADR-0070
      # items 1, 3 and 4). Every name is the plant's.
      counterpart_controllers:
        - {name: picker_joint_state_broadcaster, stage: 0}
        - {name: picker_joint_trajectory_controller, stage: 1}
      # What the vendor driver embedded in the counterpart's hardware plugin
      # serves OUTSIDE `ros2_control`, under the names the vendor creates: the
      # services the real side's track adapter and watchdog call, and the action
      # its gripper relay forwards to (ADR-0070 items 3-5). Formed once, by
      # `ids.vendor_interface`; the services are switched on under
      # `driver_node` in the counterpart's controller configuration.
      counterpart_vendor:
        driver_node: /cite/cell_b/picker/ufactory_driver
        service_namespace: /cite/cell_b/picker/picker_picker
        services:
          get_gripper_position: /cite/cell_b/picker/picker_picker/get_gripper_position
          get_linear_motor_on_zero: /cite/cell_b/picker/picker_picker/get_linear_motor_on_zero
          get_linear_motor_pos: /cite/cell_b/picker/picker_picker/get_linear_motor_pos
          set_gripper_enable: /cite/cell_b/picker/picker_picker/set_gripper_enable
          set_linear_motor_back_origin: /cite/cell_b/picker/picker_picker/set_linear_motor_back_origin
          set_linear_motor_enable: /cite/cell_b/picker/picker_picker/set_linear_motor_enable
          set_linear_motor_pos: /cite/cell_b/picker/picker_picker/set_linear_motor_pos
          set_linear_motor_speed: /cite/cell_b/picker/picker_picker/set_linear_motor_speed
          set_linear_motor_stop: /cite/cell_b/picker/picker_picker/set_linear_motor_stop
          set_mode: /cite/cell_b/picker/picker_picker/set_mode
          set_state: /cite/cell_b/picker/picker_picker/set_state
        gripper_action: /cite/cell_b/picker/picker_xarm_gripper/gripper_action
        # The controller manager services the vendor plugin calls by an
        # absolute name, each mapped onto this asset's own manager's service.
        # The side's launch remaps them on `ros2_control_node`; without it the
        # plugin's `write()` waits on a service nothing serves.
        controller_manager_remaps:
          /controller_manager/list_controllers: /cite/cell_b/picker/controller_manager/list_controllers
          /controller_manager/switch_controller: /cite/cell_b/picker/controller_manager/switch_controller
      # What the counterpart runs beside its controller manager because its
      # hardware is physical (ADR-0070 items 3-6): the deadman, and the adapters
      # that serve the simulated side's names through the vendor driver. Each
      # node is started under the name stated here with the one generated
      # `parameters` file, which carries every value it takes. The last three
      # keys are what the twin boundary reads before a mode may command this
      # side: the deadman's state, the arm controller's state (published only
      # while that controller is active), and every joint the side publishes.
      counterpart_physical:
        parameters: package://cite_generated/control/counterpart/cell_b_picker_adapters.yaml
        deadman: /cite/cell_b/picker/deadman
        track_adapter: /cite/cell_b/picker/track_adapter
        gripper_relay: /cite/cell_b/picker/gripper_relay
        # Serves InitializeAsset on initialize_service: what the operator does
        # in UFACTORY Studio before running the program (ADR-0070).
        initializer: /cite/cell_b/picker/initializer
        initialize_service: /cite/cell_b/picker/initialize
        deadman_state_topic: /cite/cell_b/picker/deadman/state
        arm_controller_state_topic: /cite/cell_b/picker/picker_joint_trajectory_controller/controller_state
        joints: [picker_drive_joint, picker_joint1, picker_joint2, picker_joint3, picker_joint4, picker_joint5, picker_track_joint]
      moveit:
        group: picker_xarm5
        base_link: picker_link_base
        tip_link: picker_link_tcp
        # The home configuration comes from L0: where an arm rests between cycles
        # is a fact about this facility, not about the vendor's robot.
        home_rad: [0, -0.35, -1.05, 0, 1.4]
        # Named joint poses the arm's program moves it through, read from that
        # program file by the generator (ADR-0067); none is written in L0.
        # `MoveTo.named_configuration` accepts `home` and each of these.
        poses_rad:
          zero: [0, 0, 0, 0, 0]
          blockly_01: [0, 0, -0.785398163, 0.785398163, 0]
          blockly_02: [-0.436332313, 0, -0.785398163, 0.785398163, -0.523598776]
          blockly_03: [-0.488692191, 0.541052068, -0.785398163, 0.244346095, -0.523598776]
          blockly_04: [-0.488692191, -0.34906585, -0.436332313, 0.785398163, -0.523598776]
          blockly_05: [1.04719755, -0.34906585, -0.436332313, 0.785398163, -0.261799388]
          blockly_06: [1.04719755, 0.523598776, -0.959931089, 0.436332313, -0.523598776]
          blockly_07: [1.04719755, -0.34906585, -0.436332313, 0.785398163, -0.523598776]
        srdf: package://cite_generated/moveit/cell_b_picker.srdf.xacro
        kinematics: package://cite_generated/moveit/cell_b_picker_kinematics.yaml
        planning_pipelines: package://cite_generated/moveit/cell_b_picker_planning_pipelines.yaml
        joint_limits: package://cite_generated/moveit/cell_b_picker_joint_limits.yaml
        cartesian_limits: package://cite_generated/moveit/cell_b_picker_cartesian_limits.yaml
        controllers: package://cite_generated/moveit/cell_b_picker_moveit_controllers.yaml
        # Which pipeline the L3 skill server asks first, and what it falls back
        # to when that one refuses (ADR-0027). Here rather than compiled into the
        # server: a planner choice is a claim about this arm, and the server's
        # own parameter names are these names, so nothing maps one to the other.
        default_pipeline: pilz_industrial_motion_planner
        default_planner_id: "PTP"
        fallback_pipeline: ompl
        fallback_planner_id: ""
        # Of the planner ids those pipelines register, the ones that define the
        # SHAPE of the path. The server refuses to let the fallback answer such a
        # request: a sampling planner would return a curve through the same
        # endpoints and the skill would report success (ADR-0027).
        cartesian_planner_ids: [LIN, CIRC]

  conveyors:
    - asset: transfer_belt
      state_topic: /cite/cell_b/transfer_belt/state
      command_topic: /cite/cell_b/transfer_belt/command
      installed_speed_mps: 0.15

  # Where the SIMULATION-ONLY grasp-hold bridge tells one arm's world plugin to
  # take hold of a work-piece and to let go of it (ADR-0065).
  #
  # Gazebo-transport names, carrying the empty message Harmonic's own
  # `DetachableJoint` takes on the same two element names. They are in the plan
  # for the reason a belt's command topic is: `generate/world.py` emits the same
  # two into the plugin's own declaration from the same `ids.interface` calls, so
  # what the bridge publishes to and what the plugin listens on come from one
  # place. A launch file assembling either would be a second place the name is
  # made.
  #
  # THE ARM'S OWN `state` TOPIC IS DELIBERATELY NOT HERE. The bridge runs in that
  # arm's namespace, exactly as its skill server does, and subscribes to the
  # relative name the server publishes on — so the name resolves rather than
  # being stated a third time.
  #
  # ONE ENTRY PER ARM THAT FITS A GRASPING END EFFECTOR, which is the identical
  # condition the world generator emits a plugin under: an entry with no plugin
  # behind it would publish into a partition where nothing listens. A zone whose
  # arms grasp nothing carries an empty list, and the hardware launch reads this
  # section not at all.
  grasp_holds:
    - asset: picker
      attach_topic: /cite/cell_b/picker/grasp/attach
      detach_topic: /cite/cell_b/picker/grasp/detach

  # A break beam has TWO topic names and they are deliberately not the same.
  #
  #   detection_topic — the name the break-beam plugin advertises on the GAZEBO
  #                     transport, from one call to `ids.interface`.
  #   level_topic     — where the bridge lands that RAW `std_msgs/Bool` level in
  #                     ROS. The reader refuses a plan that makes the two one.
  sensors:
    - asset: infeed_beam
      detection_topic: /cite/cell_b/infeed_beam/detection
      level_topic: /cite/cell_b/infeed_beam/detection_level
      # The frame the beam stands at, published by the generated static TF
      # table.
      frame_id: cell_b__infeed_beam__beam
      beam_axis: y
      beam_length_m: 0.5
    - asset: outfeed_beam
      detection_topic: /cite/cell_b/outfeed_beam/detection
      level_topic: /cite/cell_b/outfeed_beam/detection_level
      # The frame the beam stands at, published by the generated static TF
      # table.
      frame_id: cell_b__outfeed_beam__beam
      beam_axis: y
      beam_length_m: 0.5

  # What each arm's program does, step by step, read from the program file the
  # real robot's programming tool wrote (ADR-0067) and converted to SI units by
  # cite_tools.model.blockly. Nothing here is written by hand: an edit to the
  # program file is an edit to this list, and to nothing else.
  #
  #   move   a named pose from this arm's `poses_rad`, at a fraction of the
  #          description's joint velocity limit
  #   grip   a width between the pads; `expect_object` on a close
  #   wait   seconds of the cell's own clock
  #   track  a carriage position along the track, at a speed
  programs:
    - asset: picker
      source: programs/xarm5_real_demo.blockly.xml

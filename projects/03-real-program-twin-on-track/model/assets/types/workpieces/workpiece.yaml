---
# yaml-language-server: $schema=../../../schema/asset_type.schema.json
schema: cite/asset_type/v1

# The cell's reference work-piece: a 66 mm cube.
#
# THE SIZE IS DERIVED FROM THE REAL PROGRAM'S GRIPPER COMMAND (ADR-0067), and it
# was 50 mm until 2026-09-29. The real xArm 5's program closes its gripper to
# `pos` 550, which the vendor driver maps to 0.300 rad on the drive joint and the
# L0 linkage maps to 60.9 mm between the pads. A part the jaws are to STALL on
# has to be wider than that by enough to tell a stall from closing on air, and
# the two rules that say how much are `default-grasp-width-never-closes` and
# `stall-band-admits-a-stall-on-nothing` (cite_tools.validate.physical), applied
# to every width a program closes to:
#
#   60.9 mm command + 2.03 mm discrimination margin          = 62.95 mm floor
#   the band's narrow edge must clear it: 62.95 + 2.385 band = 65.33 mm
#
# 66 mm is the smallest whole millimetre above that. The mass stays 0.200 kg.
#
# WHY THIS FILE EXISTS AT ALL, because L0 deliberately held out against it for a
# while and the reason it gave was a good one. `Facility.workpiece_models` used
# to hold names and nothing else, on the grounds that a work-piece with
# attributes nobody reads is invented schema. That held until two separate rules
# turned out to need the same missing fact:
#
#   * `insufficient-support-margin` (cite_tools.validate.geometric) has to know
#     how much of a body a part covers before it can say how far a place point
#     must sit from that body's edge. Without it, `cell_a__conveyor_1__infeed`
#     sat exactly on the belt's leading edge, every placed cube tipped over the
#     end and fell 0.6 m to the floor, and the model validated cleanly the whole
#     time.
#   * `default-grasp-width-never-closes` (cite_tools.validate.physical) could
#     only enforce "narrower than the gripper opens" — 88.93 mm — when the bound
#     that actually matters is "narrower than the part". Its own docstring said
#     so and named this gap as the blocker.
#
# Two consumers make it a fact the model owes, not a field for symmetry (P5).
#
# WHY IT IS AN ASSET TYPE and not a new document kind: a work-piece needs exactly
# what every other authored object needs — extents, mass, a centroidal inertia
# tensor — and `Body` already says all of it and is already validated by
# `cite_tools.validate.physical`. A parallel declaration would be a second Body
# to keep in step.
#
# It has no instances, and that is the point of the category. Where a work-piece
# is at any moment is the process's business; the layout describes what is bolted
# down. Nothing generated places one.
#
# THE ID IS ALSO THE SPAWNED MODEL NAME. `Facility.workpiece_models` reaches the
# generated world as the belt's `<carry>` list and the break beam's `<watch>`
# list, both of which match on the Gazebo model name. So this type's id and the
# name a part is spawned under have to be the same string, and they are.
asset_type:
  id: workpiece
  category: workpiece

  # No frames. A work-piece is grasped and placed by its centre; nothing in the
  # model reaches for a named point on it.

  description:
    provider: body
    body:
      visual:
        kind: box
        size_m: [0.066, 0.066, 0.066]
      collision:
        kind: box
        size_m: [0.066, 0.066, 0.066]
      inertial:
        # 0.2 kg over 2.875e-4 m^3 is 696 kg/m^3 — a hardwood block, and inside
        # the plausibility band `validate.physical` enforces.
        mass_kg: 0.200
        # Centroidal, like every tensor in this model, and relative to the CENTRE
        # of the collision box.
        com_m: [0.0, 0.0, 0.0]
        # Solid cube 0.066 m at 0.2 kg, identical on all three axes:
        #   i = m/12 * (a^2 + a^2) = 0.2/12 * (0.004356 + 0.004356) = 1.452e-4
        ixx: 0.0001452
        iyy: 0.0001452
        izz: 0.0001452
      material: workpiece_stock

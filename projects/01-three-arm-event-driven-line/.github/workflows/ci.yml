---
name: CI

# CI runs the same scripts a developer runs, inside the same image. If these
# two ever diverge, "green in CI, broken locally" becomes possible again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything that needs no ROS. Runs in about a minute and
  # catches most mistakes before the expensive job starts.
  host-tooling:
    name: Host tooling (lint, types, model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Bootstrap host tooling
        run: ./scripts/bootstrap --host-only

      - name: Lint
        run: ./scripts/lint

      - name: Host tooling tests
        # --host-only: this job has no ROS, and without the flag the script would
        # route itself into the container and duplicate the ros-workspace job.
        run: ./scripts/test --host-only

      - name: Validate facility model
        # Also the hand-edit and determinism check: it regenerates every artifact
        # and diffs the result against the committed tree (ADR-0021). Running it
        # here, on a job with no ROS at all, is what makes the check cheap enough
        # to be on every pull request.
        run: ./scripts/validate-model

  ros-workspace:
    name: ROS workspace (build, test)
    runs-on: ubuntu-24.04
    needs: host-tooling
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          tags: cite-digital-twin:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bootstrap workspace
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/bootstrap --in-container

      - name: Build
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/build

      # The host-tooling job above also runs ./scripts/lint, but that runner has no
      # ROS at all, so its ROS-package block skips itself and reports so. This is
      # the only place the C++, CMake and package linters can actually run —
      # without this step the project has no C++ linting in CI whatsoever, which
      # is how ~630 lines of new C++ reached this branch unlinted (T-04).
      #
      # BLOCKING as of this change. The condition this step recorded for its own
      # promotion has been met: every first-party package now declares
      # <test_depend>ament_lint_common</test_depend>, so ament_lint_auto discovers
      # a real linter set instead of none. cite_generated is generated, so its
      # declaration lives in tools/cite_tools/templates/package/ and never in the
      # artifact (ADR-0021).
      #
      # Verified before flipping, not assumed: ./scripts/lint reports
      # "Lint clean" across all 7 packages in the container. The first attempt at
      # that check reported 2 packages registering no linters and was wrong - the
      # build volume was stale.
      #
      # What "Lint clean" covers is now worth stating, because it used to be much
      # weaker than it read. ./scripts/lint selected linters with `-R "lint"`, a
      # NAME filter, which matched cpplint, lint_cmake and xmllint and silently
      # dropped flake8, pep257, copyright, cppcheck and uncrustify. The gate ran
      # 3 of 8 linters per package. It selects by the `linter` LABEL now, which is
      # what ament actually sets: 41 linter tests across the 7 packages, all
      # passing. The promotion above was right in outcome and under-justified in
      # its reasoning; this is the justification it should have had.
      #
      # "Rebuild before trusting a lint result here" used to be the whole defence,
      # and a note in a workflow file is not a defence. ./scripts/lint now refuses
      # to answer at all unless the build tree carries a fingerprint matching the
      # first-party package.xml and CMakeLists.txt files on disk, so a stale tree
      # produces a diagnosis naming the build directory instead of a confident
      # wrong linter set. See the build-freshness block in scripts/_lib.sh.
      #
      # The Build step above always precedes this one, which is what keeps that
      # check satisfied in CI. Do not reorder them.
      - name: Lint ROS packages
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/lint

      - name: Test
        run: |
          docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/test

      # -----------------------------------------------------------------------
      # WHAT THE SCENARIO STEPS GATE ON, and why every one of them passes
      # --teardown-advisory.
      #
      # A scenario answers two independent questions in one exit code: did the
      # cell do the thing (the active-phase tests), and did every process exit
      # cleanly (the `@post_shutdown_test` TestCleanShutdown class). The second
      # currently fails for a reason outside this project — a SIGSEGV/abort
      # inside rclpy/rmw destruction, measured at ~7.5% per process over 40
      # trials, which across the processes a scenario launches is about a
      # one-in-five chance of a spurious teardown failure per run. Two blocking
      # bringup attempts at that rate red the build roughly a third of the time
      # for nothing. A gate that fails one run in five for an upstream reason is
      # not a gate; it is a coin toss that teaches people to re-run until green.
      #
      # THE EXEMPTION ROUTE IS CLOSED, on evidence rather than on principle.
      # Allowing the offending process its exit code would be the obvious fix and
      # it does not work: teardown failures here have landed on at least four
      # distinct processes with three distinct exits — `parameter_bridge` (-6),
      # `gz` (-9) and `topology_server.py` (1) among them — and CLAUDE.md §2
      # records the conclusion that process identity does not predict them.
      # `topology_server.py` is ours, so even "exempt the upstream processes"
      # has no boundary to draw. There is no signature to key on, and the
      # existing one-process one-signal `move_group`/-11 allowance is already on
      # the record as the mistake of exempting the process that most needed the
      # assertion. Widening it would leave an assertion that cannot fail.
      #
      # So the split is by PHASE, which is a real property of a run, and never by
      # process or exit code, which are not. --teardown-advisory does NOT delete,
      # skip or exempt anything: TestCleanShutdown still runs, still checks every
      # process, and still reports every bad exit — as a `::warning` annotation on
      # the pull request, not only into a collapsed log. It stops deciding the
      # exit status, and nothing else. A cycle failure still reds the build under
      # either policy, which is asserted in scripts/_selftest.sh alongside the
      # case that matters most: a FIRST-PARTY teardown failure is treated exactly
      # like an upstream one rather than being told apart by name.
      #
      # WHAT WOULD MAKE TEARDOWN BLOCKING AGAIN is the fix the assertion's own
      # docstring already names — a teardown coordinator in `cite_bringup`, or a
      # lifecycle-managed bridge — not a wider allowlist and not a longer timeout.
      # Until then this is the honest shape: the question that is answerable
      # gates, the question that is not is reported.
      # -----------------------------------------------------------------------
      - name: Simulation-in-the-loop scenarios
        # The gate the charter's exit criterion actually names: the cell brought
        # up headlessly and driven through its real interfaces. Run twice, because
        # a scenario that passes once proves less than one that passes repeatably
        # — and a flaky scenario trains people to re-run until green, which is
        # worse than having none.
        run: |
          for attempt in 1 2; do
            echo "::group::scenario bringup (attempt $attempt)"
            docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
              cite-digital-twin:dev ./scripts/scenario bringup --teardown-advisory
            echo "::endgroup::"
          done

      # Phase 1.C's acceptance claim rests on pick_and_place: one arm picks a
      # work-piece off the table and places it on the belt, held by friction alone
      # since ADR-0029 removed the attachment plugin.
      #
      # BLOCKING as of this change, on its cycle assertion. The condition this step
      # recorded for its own promotion had narrowed to exactly one thing —
      # reproducibility — and that is now answered: the cycle passed 6 of 6 in an
      # isolated, freshly built tree at this commit, after an independent 5 of 5
      # recorded in CLAUDE.md §2. Eleven consecutive cycle passes across two
      # separate measurements is "passes repeatably" by any reading, and it is the
      # reading this step's own text asked for.
      #
      # WHAT KEPT IT ADVISORY UNTIL NOW, and why neither reason survives:
      #
      #   * "It fails every time." It did — 0 of 18, every run releasing the cube
      #     short of the belt and dropping it on the floor. That was a real
      #     placement defect and it is fixed: b2be77f moved the belt transfer
      #     frames 0.050 m inboard so a released cube is no longer neutrally stable
      #     on the belt's end plane, and ADR-0030 gave L0 the work-piece geometry
      #     that makes the rule expressible at all.
      #   * "One green run is not a promotion case." Correct, and it is no longer
      #     one run.
      #
      # THE SEEDING CONDITION IS DELIBERATELY NOT CARRIED FORWARD. It asked that
      # the stochastic path be seeded end to end, and ADR-0027 establishes that it
      # is not meetable: `gz sim --seed` reaches gz::math::Rand, not the physics
      # solver, and MoveIt exposes no hook to seed OMPL. Holding a gate behind a
      # condition that cannot be met is a way of never gating. What that condition
      # was really protecting against is a flaky hard gate, and the answer to that
      # is the pass count above plus the phase split, not determinism.
      #
      # THE HISTORY THAT STILL BINDS, because it cost this file a retraction: an
      # earlier version recorded "10/11 cycle passes" that was measured against
      # another worktree's binaries through shared Docker build volumes. The
      # command was right, the machine was quiet, and the answer described code
      # nobody was looking at. Volumes are namespaced per checkout now
      # (cite_project_name in scripts/_lib.sh) and lint and test refuse to answer
      # from a build tree that does not match the source, so that class of number
      # cannot be produced silently again. Measure it in an isolated tree or do not
      # put the number here.
      #
      # WHAT RETRACTS THIS PROMOTION: the cycle failing on a run that is not
      # explained by the machine. Do not answer such a run by widening a tolerance
      # or by adding a teardown allowance — see the phase-split block above for why
      # the teardown half is reported rather than gated here.
      - name: Simulation-in-the-loop scenario — pick_and_place
        run: |
          docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/scenario pick_and_place --teardown-advisory

      # Phase 1.D's acceptance claim rests on continuous_line — work-pieces enter
      # at the pick area and arrive at accumulation, sensor-triggered, with no
      # intervention.
      #
      # STILL ADVISORY, and for a different reason than when this step was written.
      # The three blockers recorded here are closed; the fourth condition,
      # reproducibility, is not, and it is the only one left.
      #
      # WHAT CLOSED. This step used to describe a line that could not start at all:
      # 0 of 4 runs left the FIRST of nine milestones, because station_transfer_1's
      # source-fed pick point had no sensor that could observe it, a detection
      # carried the beam's pose rather than the part's, and nothing at L4 commanded
      # a belt. All three are addressed — the aid topics are bridged, `Detect` turns
      # a beam level into a typed `DetectionEvent`, L4 stops the belt on that edge
      # and restarts it on `CompleteHandoff` (ADR-0032), and the beam indexes on the
      # part's body rather than its origin (ADR-0033). The milestone ladder reached
      # 10 of 10 where it had been stuck at 4 of 10.
      #
      # WHAT DOES NOT CLOSE, and it is condition 4 verbatim: it passes repeatably.
      # The measurements at this commit do not support a gate. CLAUDE.md §2 records
      # two of four runs carrying all three pieces end to end, with nine of twelve
      # pieces traversing every milestone; a separate verification put the cycle at
      # three of four. Either way this is one agent's four runs on one machine with
      # no thresholds registered in advance — the same shape of evidence that cost
      # the pick_and_place block above a retraction. A step that fails a quarter to
      # a half of the time is the coin toss this file keeps arguing against, and
      # promoting it would make that argument dishonest.
      #
      # THE KNOWN RESIDUAL, so that a failing run is recognised rather than
      # re-run: a piece has stalled at 8 of 10 after an arm closed on air at a
      # conveyor outfeed, following the loosest grasp recorded anywhere. The stated
      # hypothesis is that a leading-edge test makes the index position depend on
      # the part's yaw, so a square part arriving yawed parks a few millimetres
      # short. That sensitivity is REAL ON HARDWARE — a physical photo-eye behaves
      # the same way — and must not be described as a simulation artefact or
      # compensated in the beam. Whether the residual accumulates over three
      # stations is explicitly unmeasured; see
      # docs/measurements/2026-08-26-conveyor-yaw-transfer/.
      #
      # PROMOTION CONDITION, now one rather than four: the cycle passes repeatably
      # in an isolated freshly built tree, measured against thresholds written down
      # before the runs. Not a tolerance change, and not a teardown allowance — the
      # teardown half is already reported rather than gated, for the reasons in the
      # phase-split block above, so it is neither the obstacle here nor the lever.
      - name: Simulation-in-the-loop scenario — continuous_line (advisory)
        continue-on-error: true
        run: |
          docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/scenario continuous_line --teardown-advisory

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: workspace/log/
          if-no-files-found: ignore

  # Reproducibility is a first-class CI concern here, not an afterthought.
  # The previous iteration of this project died of a dependency failure.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Third-party source vendored into the tree
        run: |
          if [ -d workspace/src/external ] && \
             git ls-files --error-unmatch workspace/src/external >/dev/null 2>&1; then
            echo "::error::External source is tracked in git. It must be imported by vcstool, not committed."
            exit 1
          fi
          echo "No vendored external source."

      - name: Gitlinks without a .gitmodules entry
        run: |
          links=$(git ls-files -s | awk '$1=="160000" {print $4}')
          if [ -n "$links" ] && [ ! -f .gitmodules ]; then
            echo "::error::Submodule gitlinks exist with no .gitmodules — a fresh clone would lose them:"
            echo "$links"
            exit 1
          fi
          echo "No orphaned gitlinks."

      - name: CVE scan (advisory)
        # Advisory, not blocking. The pinned tooling versions currently carry known
        # advisories; making this a hard gate would block every unrelated change
        # before anyone has assessed whether the affected paths are reachable.
        # Tighten to --strict once the pins are triaged.
        continue-on-error: true
        run: |
          docker build -f infra/docker/Dockerfile -t cite-digital-twin:dev . >/dev/null
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/audit-deps

      - name: Manifest entries not pinned to a commit SHA
        # One implementation, shared with ./scripts/doctor (P1). This step used to
        # restate the check as `grep -E '^\s+version:\s*[a-z]'`, which is a
        # starts-with-lowercase test rather than a SHA validator: it called a real
        # 40-character SHA beginning with a-f unpinned, and passed a branch named
        # `2.x` as pinned. Two copies of a check are two chances to be wrong
        # differently, which is what happened.
        #
        # Blocking, not advisory. This is the only mechanical guard on ADR-0008.
        run: |
          # shellcheck source=scripts/_lib.sh
          source scripts/_lib.sh
          unpinned="$(unpinned_manifest_entries "$CITE_VCS_MANIFEST")"
          if [ -n "$unpinned" ]; then
            echo "$unpinned" | while read -r entry; do
              echo "::error file=external/cite.repos::Not pinned to a commit SHA: ${entry}"
            done
            exit 1
          fi
          echo "All manifest entries pinned to a 40-character commit SHA."

---
name: Projects

# The frozen milestone snapshots under projects/ (ADR-0068), each built and run
# from its own folder exactly as someone handed that folder would.
#
# NOT A GATE ON main. It runs on demand and once a week, and no branch
# protection requires it: a snapshot is a record of a past commit, and a change
# to the main tree cannot fix one. What this job is for is noticing that a
# snapshot has stopped building or running, which otherwise nothing would.
#
# READ THE STEP LOGS, NOT THE CONCLUSIONS. Every scenario step passes
# --teardown-advisory (as scenario_args in projects/snapshots.yaml), so a failed post-shutdown check prints
# "passed its cycle assertions" and the step still succeeds; the verdict string
# in the log is the result. The main CI file's phase-split block says why.
#
# Each step mirrors the ros-workspace job in ci.yml, with two differences only:
# the build context and the bind mount are the snapshot's folder rather than the
# repository root, and the image carries the snapshot's own tag.

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is read from projects/snapshots.yaml, the one place the snapshots
  # are listed (ADR-0068), rather than restated here. `yq` is preinstalled on the
  # ubuntu-24.04 runner image.
  matrix:
    name: Read projects/snapshots.yaml
    runs-on: ubuntu-24.04
    outputs:
      snapshots: ${{ steps.read.outputs.snapshots }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "snapshots=$(yq -o=json -I=0 '.snapshots' projects/snapshots.yaml)" >> "$GITHUB_OUTPUT"

  snapshot:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      # Three independent records: one that has rotted says nothing about the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.snapshots) }}
    env:
      SNAPSHOT: projects/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SNAPSHOT }}
          file: ${{ env.SNAPSHOT }}/infra/docker/Dockerfile
          tags: ${{ matrix.image }}
          load: true
          # ONE cache for all three, because their Dockerfiles and the requirements
          # they COPY are byte-identical today (md5sum, 2026-09-29), so the layers are
          # the same layers. mode=min exports only the final image's layers, which is
          # all a same-Dockerfile rebuild can reuse. If a snapshot's build inputs ever
          # diverge, give it its own scope rather than let the three evict each other.
          cache-from: type=gha,scope=projects
          cache-to: type=gha,mode=min,scope=projects

      - name: Bootstrap workspace
        run: |
          docker run --rm -v "$PWD/$SNAPSHOT:/workspace" -w /workspace \
            "${{ matrix.image }}" ./scripts/bootstrap --in-container

      - name: Validate facility model
        run: |
          docker run --rm -v "$PWD/$SNAPSHOT:/workspace" -w /workspace \
            "${{ matrix.image }}" ./scripts/validate-model

      - name: Build
        run: |
          docker run --rm -v "$PWD/$SNAPSHOT:/workspace" -w /workspace \
            "${{ matrix.image }}" ./scripts/build

      - name: Simulation-in-the-loop scenario — ${{ matrix.scenario }}
        # scenario_args is unquoted on purpose: it is a word list from the manifest.
        run: |
          docker run --rm --shm-size=2gb -v "$PWD/$SNAPSHOT:/workspace" -w /workspace \
            "${{ matrix.image }}" ./scripts/scenario "${{ matrix.scenario }}" ${{ matrix.scenario_args }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-log
          path: ${{ env.SNAPSHOT }}/workspace/log/
          if-no-files-found: ignore

---
name: CI

# CI runs the same scripts a developer runs, inside the same image. If these
# two ever diverge, "green in CI, broken locally" becomes possible again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything that needs no ROS. Runs in about a minute and
  # catches most mistakes before the expensive job starts.
  host-tooling:
    name: Host tooling (lint, types, model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Bootstrap host tooling
        run: ./scripts/bootstrap --host-only

      - name: Lint
        run: ./scripts/lint

      - name: Host tooling tests
        # --host-only: this job has no ROS, and without the flag the script would
        # route itself into the container and duplicate the ros-workspace job.
        run: ./scripts/test --host-only

      - name: Validate facility model
        # Also the hand-edit and determinism check: it regenerates every artifact
        # and diffs the result against the committed tree (ADR-0021). Running it
        # here, on a job with no ROS at all, is what makes the check cheap enough
        # to be on every pull request.
        run: ./scripts/validate-model

  ros-workspace:
    name: ROS workspace (build, test)
    runs-on: ubuntu-24.04
    needs: host-tooling
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          tags: cite-digital-twin:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bootstrap workspace
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/bootstrap --in-container

      - name: Build
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/build

      - name: Test
        run: |
          docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/test

      - name: Simulation-in-the-loop scenarios
        # The gate the charter's exit criterion actually names: the cell brought
        # up headlessly and driven through its real interfaces. Run twice, because
        # a scenario that passes once proves less than one that passes repeatably
        # — and a flaky scenario trains people to re-run until green, which is
        # worse than having none.
        run: |
          for attempt in 1 2; do
            echo "::group::scenario bringup (attempt $attempt)"
            docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
              cite-digital-twin:dev ./scripts/scenario bringup
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: workspace/log/
          if-no-files-found: ignore

  # Reproducibility is a first-class CI concern here, not an afterthought.
  # The previous iteration of this project died of a dependency failure.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Third-party source vendored into the tree
        run: |
          if [ -d workspace/src/external ] && \
             git ls-files --error-unmatch workspace/src/external >/dev/null 2>&1; then
            echo "::error::External source is tracked in git. It must be imported by vcstool, not committed."
            exit 1
          fi
          echo "No vendored external source."

      - name: Gitlinks without a .gitmodules entry
        run: |
          links=$(git ls-files -s | awk '$1=="160000" {print $4}')
          if [ -n "$links" ] && [ ! -f .gitmodules ]; then
            echo "::error::Submodule gitlinks exist with no .gitmodules — a fresh clone would lose them:"
            echo "$links"
            exit 1
          fi
          echo "No orphaned gitlinks."

      - name: CVE scan (advisory)
        # Advisory, not blocking. The pinned tooling versions currently carry known
        # advisories; making this a hard gate would block every unrelated change
        # before anyone has assessed whether the affected paths are reachable.
        # Tighten to --strict once the pins are triaged.
        continue-on-error: true
        run: |
          docker build -f infra/docker/Dockerfile -t cite-digital-twin:dev . >/dev/null
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/audit-deps

      - name: Manifest entries not pinned to a commit SHA
        run: |
          if grep -nE '^\s+version:\s*[a-z]' external/cite.repos; then
            echo "::warning::Unpinned dependency above. Reproducibility is not \
            guaranteed until every entry pins a commit SHA (Phase 1.A gate)."
          else
            echo "All manifest entries pinned."
          fi

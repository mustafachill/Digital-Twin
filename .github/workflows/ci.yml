---
name: CI

# CI runs the same scripts a developer runs, inside the same image. If these
# two ever diverge, "green in CI, broken locally" becomes possible again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything that needs no ROS. Runs in about a minute and
  # catches most mistakes before the expensive job starts.
  host-tooling:
    name: Host tooling (lint, types, model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Bootstrap host tooling
        run: ./scripts/bootstrap --host-only

      - name: Lint
        run: ./scripts/lint

      - name: Host tooling tests
        # --host-only: this job has no ROS, and without the flag the script would
        # route itself into the container and duplicate the ros-workspace job.
        run: ./scripts/test --host-only

      - name: Validate facility model
        # Also the hand-edit and determinism check: it regenerates every artifact
        # and diffs the result against the committed tree (ADR-0021). Running it
        # here, on a job with no ROS at all, is what makes the check cheap enough
        # to be on every pull request.
        run: ./scripts/validate-model

  ros-workspace:
    name: ROS workspace (build, test)
    runs-on: ubuntu-24.04
    needs: host-tooling
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          tags: cite-digital-twin:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bootstrap workspace
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/bootstrap --in-container

      - name: Build
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/build

      # The host-tooling job above also runs ./scripts/lint, but that runner has no
      # ROS at all, so its ROS-package block skips itself and reports so. This is
      # the only place the C++, CMake and package linters can actually run —
      # without this step the project has no C++ linting in CI whatsoever, which
      # is how ~630 lines of new C++ reached this branch unlinted (T-04).
      #
      # BLOCKING as of this change. The condition this step recorded for its own
      # promotion has been met: every first-party package now declares
      # <test_depend>ament_lint_common</test_depend>, so ament_lint_auto discovers
      # a real linter set instead of none. cite_generated is generated, so its
      # declaration lives in tools/cite_tools/templates/package/ and never in the
      # artifact (ADR-0021).
      #
      # Verified before flipping, not assumed: ./scripts/lint reports
      # "Lint clean" across all 7 packages in the container. The first attempt at
      # that check reported 2 packages registering no linters and was wrong - the
      # build volume was stale.
      #
      # What "Lint clean" covers is now worth stating, because it used to be much
      # weaker than it read. ./scripts/lint selected linters with `-R "lint"`, a
      # NAME filter, which matched cpplint, lint_cmake and xmllint and silently
      # dropped flake8, pep257, copyright, cppcheck and uncrustify. The gate ran
      # 3 of 8 linters per package. It selects by the `linter` LABEL now, which is
      # what ament actually sets: 41 linter tests across the 7 packages, all
      # passing. The promotion above was right in outcome and under-justified in
      # its reasoning; this is the justification it should have had.
      #
      # "Rebuild before trusting a lint result here" used to be the whole defence,
      # and a note in a workflow file is not a defence. ./scripts/lint now refuses
      # to answer at all unless the build tree carries a fingerprint matching the
      # first-party package.xml and CMakeLists.txt files on disk, so a stale tree
      # produces a diagnosis naming the build directory instead of a confident
      # wrong linter set. See the build-freshness block in scripts/_lib.sh.
      #
      # The Build step above always precedes this one, which is what keeps that
      # check satisfied in CI. Do not reorder them.
      - name: Lint ROS packages
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/lint

      - name: Test
        run: |
          docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/test

      - name: Simulation-in-the-loop scenarios
        # The gate the charter's exit criterion actually names: the cell brought
        # up headlessly and driven through its real interfaces. Run twice, because
        # a scenario that passes once proves less than one that passes repeatably
        # — and a flaky scenario trains people to re-run until green, which is
        # worse than having none.
        run: |
          for attempt in 1 2; do
            echo "::group::scenario bringup (attempt $attempt)"
            docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
              cite-digital-twin:dev ./scripts/scenario bringup
            echo "::endgroup::"
          done

      # Phase 1.C's acceptance claim rests on pick_and_place, and until now no gate
      # ran it: CI ran bringup twice and never this one, and tests/scenarios/ lives
      # outside workspace/ so colcon test does not collect it either. A claim no job
      # exercises is not evidence.
      #
      # STILL NOT BLOCKING, and the honest reason is now much simpler than it was:
      # the cycle does not pass. Not "passes 8/8", not "10/11" — 0 out of 18.
      #
      # RETRACTION, because a wrong number in this file is worse than none. An
      # earlier version of this comment recorded "10/11 cycle passes on an
      # otherwise idle machine". That measurement was invalid and the reason is
      # instructive: every checkout on this host shared one set of Docker build
      # volumes, so those runs executed binaries built by a different worktree
      # from a different commit. The command was right, the machine was quiet, and
      # the answer described code nobody was looking at. Volumes are namespaced
      # per checkout now (cite_project_name in scripts/_lib.sh) and the gates
      # refuse to run against a build tree that does not match the source, so this
      # class of number cannot be produced silently again.
      #
      # Re-measured after that fix, 18 runs over two commits, own build, own
      # volumes:
      #
      #   cycle test          0/18 pass. Every failure is the same physical
      #                       outcome: the work-piece is picked (it reaches
      #                       z≈0.745 from a 0.625 rest), carried, and released
      #                       short of the belt's leading edge, ending on the
      #                       FLOOR at z=0.025 instead of on the belt at 0.625.
      #                       Final x ranged 0.285-0.422 against a place frame at
      #                       0.450. The infeed frame sits exactly on the belt's
      #                       leading edge, so any undershoot at all drops the part
      #                       off the front. This is a placement-accuracy defect in
      #                       the skill/grasp path, not in this workflow.
      #   caught by height    2 of the 4 failures analysed in detail were inside
      #                       the 0.10 m horizontal tolerance and were caught ONLY
      #                       by the height assertion added alongside this comment.
      #                       Before that assertion existed those two runs reported
      #                       success with the work-piece lying on the floor, which
      #                       is precisely the baseline this scenario was found in.
      #   clean-shutdown test 16/18 pass.
      #   move_group -11      present in all 18 runs, all three arms. The upstream
      #                       MoveIt destructor segfault, already exempted.
      #   -9 / -15 family     2/18, and both were the two SLOWEST runs in the set:
      #                       183 s and 239 s against an 88-143 s norm. Both show
      #                       the same signature — move_group truncated to -15
      #                       instead of completing its -11 crash, and skill_server
      #                       SIGKILLed at -9. That is launch's SIGTERM/SIGKILL
      #                       escalation firing on a run too slow to finish
      #                       teardown inside its window, i.e. machine contention,
      #                       not an independent defect. Duration predicts it. The
      #                       original report's `gz -9` on a 179 s run is the same
      #                       mechanism on a different process.
      #   parameter_bridge -6 0/18 here; observed exactly once, earlier, on the
      #                       contended shared-volume setup. NOT declared absent on
      #                       that evidence — one occurrence with a fully
      #                       characterised cause is still a real defect. It is a
      #                       glibc robust-mutex abort inside the bridge's own
      #                       SIGINT handler, lands in the same millisecond as the
      #                       signal, and is therefore NOT slowness: no timeout
      #                       could change it. Characterised next to the assertion
      #                       that catches it in tests/scenarios/bringup.py, and
      #                       deliberately NOT exempted.
      #
      # None of these teardown signals is exempted beyond the single pre-existing
      # move_group -11 allowance. Widening that list would turn the one assertion
      # covering shutdown into one that cannot fail.
      #
      # The three conditions recorded here previously, each re-checked:
      #
      #   1. "The stochastic path is seeded end to end (T-03/R-13)." NOT met, and
      #      not meetable as written. CITE_PHYSICS_SEED does now reach the
      #      simulator — `simulation.launch.py` passes it to `gz sim --seed` — but
      #      that seeds gz::math::Rand, so sensor noise and the transport RNG, and
      #      neither the physics solver nor OMPL. MoveIt exposes no hook to seed
      #      OMPL and is apt-installed rather than pinned in external/cite.repos,
      #      so there is no patch point either (ADR-0027). Planning here stays
      #      genuinely non-deterministic. What this condition was protecting
      #      against is a flaky hard gate; that question is moot while the pass
      #      rate is zero.
      #   2. "The grasp/skill failure in cite_skills is closed." PARTLY. The arm
      #      does grasp by friction since the attachment plugin was removed
      #      (ADR-0029) and lifts the work-piece in all 18 runs — that half is
      #      real. But the cycle still does not deliver: the release point misses
      #      the belt. The condition was written when "grasp" was the whole
      #      problem, and closing it moved the failure downstream rather than
      #      removing it.
      #   3. "cell_a_plan.yaml's declared topics exist at runtime (T-06)." The two
      #      blockers this condition named are gone: break_beam.cpp is in a
      #      CMakeLists target now, and the conveyor plugin is instantiated three
      #      times in the generated world. The topics themselves still do not exist
      #      as ROS topics — both plugins speak Gazebo transport and only /clock is
      #      bridged — but the guess attached to this condition, that the step "may
      #      well fail on that alone", is measured false: this scenario never
      #      subscribes to them and fails for an unrelated reason.
      #
      # So: no promotion. There is nothing subtle left in that call — a step that
      # fails every time is not a candidate for a gate, and the earlier debate
      # about which half to gate was conducted over a number that turned out to be
      # measuring another checkout's build.
      #
      # What WOULD make this promotable is one fix, not three: the release point
      # has to land on the belt rather than at its leading edge. That belongs to
      # the skill/orchestration path, and until it lands this step earns its keep
      # by running on every push and showing the failure rather than hiding it.
      #
      # THE 0/18 ABOVE IS NO LONGER CURRENT, and the fix it asks for has landed.
      # Everything above this line was measured at 800cf5c/31f6f8d, which precede
      # b2be77f — the commit that moved the belt transfer frames 0.050 m inboard so
      # that a released cube is no longer neutrally stable on the belt's end plane.
      # It is left standing rather than rewritten because the analysis is still how
      # the failure was found, and a number in this file has already been wrong once
      # by being supplied rather than measured.
      #
      # Re-measured on 2026-08-26 in an isolated worktree against its own build:
      # ONE run, cycle OK in 100.6 s and teardown OK. CLAUDE.md §2 records 5 of 5
      # for this commit from a separate measurement. One run here plus a count taken
      # elsewhere is not a promotion case — condition 1 above, reproducibility, is
      # still unmet under ADR-0027, and the step's own history is the argument for
      # not promoting on a small green sample. What has changed is that the reason
      # is now reproducibility alone and no longer "it fails every time".
      - name: Simulation-in-the-loop scenario — pick_and_place (advisory)
        continue-on-error: true
        run: |
          docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/scenario pick_and_place

      # Phase 1.D's acceptance claim rests on continuous_line — N work-pieces enter
      # at the pick area and arrive at accumulation, sensor-triggered, with no
      # intervention — and until this step nothing ran it. That is the same gap the
      # block above opens with: a claim no job exercises is not evidence.
      #
      # ADVISORY, and NOT because it is flaky. It fails identically every time and
      # the failure is understood. Measured on 2026-08-26, four runs in one isolated
      # worktree against its own build and its own volumes:
      #
      #   cycle test     0/4. Every run stops at the FIRST of the nine milestones
      #                  the generated topology defines. The work-piece is fed onto
      #                  the pick table at (-0.475, 0.000, 0.625) and is still there,
      #                  unmoved to the millimetre, ~700 samples and 420 s later. No
      #                  beam ever reports. station_transfer_1 sits at StationState 2
      #                  (WORKING) with occupancy 0/1 while stations 2 and 3 stay at
      #                  1 (WAITING) — arm_1 has claimed its reach and is waiting on
      #                  something that cannot arrive. Run duration 442-459 s, which
      #                  is the 420 s milestone ceiling plus bring-up.
      #   teardown test  3/4. Reported separately from the cycle on purpose: the two
      #                  answer different questions and one has been used to explain
      #                  the other before. The single failure is NOT the
      #                  duration-correlated -9/-15 family bringup.py characterises
      #                  — the failing run was not the slowest — and it is not
      #                  move_group. It is ours, and it is described below.
      #
      # WHAT THE LINE IS WAITING ON, probed against the running cell rather than
      # inferred from the code:
      #
      #     ros2 action send_goal /cite/cell_a/detection/detect \
      #       cite_interfaces/action/Detect \
      #       "{region_frame: 'cell_a__table_pick__surface', \
      #         region_size_m: {x: 0.3, y: 0.3, z: 0.3}, workpiece_type: ''}"
      #     -> SUCCEEDED, detections: [], detail: "no sensor in this zone lies inside
      #        the requested region, so nothing is observed there"
      #
      # This zone detects with break beams; all three stand at a conveyor outfeed and
      # none covers table_pick. line_tree.hpp sets require_immediate=0 for a station
      # with no trigger, so DetectAt reads an empty result as "the line is idle" and
      # re-sends for ever rather than failing — right for a source-fed station, and
      # unreachable here because no sensor in the zone can ever answer for that
      # frame. The coordinator confirms where it was stuck on its own way out:
      #
      #     /cite/cell_a/detection/detect did not answer a blanket cancellation;
      #     a goal it accepted without telling us may still be executing
      #
      # THE TEARDOWN FAILURE, which is a defect of ours and is NOT exempted. On the
      # one failing run line_orchestrator exited -6 in the same dispatch as the
      # SIGINT, with no escalation, printing:
      #
      #     terminate called after throwing an instance of
      #       'rclcpp_action::exceptions::UnknownGoalHandleError'
      #       what():  Goal handle is not known to this client.
      #
      # SkillNode::abandon() in cite_orchestration calls async_cancel_goal(handle_)
      # on halt; rclcpp_action throws that exception when the goal has already
      # terminated and the client has dropped the handle, and nothing catches it, so
      # it reaches std::terminate on the tick thread. DetectAt's poll loop makes it
      # likely here because its goals complete in milliseconds, but the path is every
      # halt — recovery and preemption included, not just shutdown. The other three
      # runs took cancel_all() instead, which does not throw and instead logs the
      # blanket-cancellation warning quoted above, which is why this is 1 in 4 and
      # not 4 in 4. Widening the -11 exemption to cover it would hide a live
      # cancellation bug behind a teardown allowance; the fix is a guard in
      # skill_nodes.hpp.
      #
      # TWO MORE BLOCKERS STAND BEHIND THE FIRST. Read from the code and the
      # generated model and NOT observed, because the line stops before reaching
      # either — recorded so that closing blocker one is not mistaken for closing the
      # line:
      #
      #   * A detection reports where the BEAM is, not where the part is.
      #     detection_server.cpp fills Detection.pose with the sensor's own transform
      #     in the region frame, and cell_a_static_tf.yaml puts
      #     cell_a__beam_c1_out__beam at (1.550, 0.250, 0.630) against
      #     cell_a__conveyor_1__outfeed at (1.600, 0.000, 0.600) — 0.250 m off the
      #     belt centreline, which is where the housing must stand to keep out of the
      #     gripper's descent. PickAt sends that pose straight through as
      #     object_pose, so a station picking at a detected pose reaches beside the
      #     belt rather than at the part.
      #   * Nothing in the running system commands a conveyor. line_orchestrator
      #     plans, arbitrates, tracks custody and calls skills, and commands no belt,
      #     while conveyors.yaml says the runtime setpoint is L4's decision. The
      #     scenario therefore supplies it, and says so. It also cannot be the whole
      #     answer: at 0.150 m/s a piece passes beam_c1_out 0.050 m before the pick
      #     point and leaves the belt 0.100 m after it — 0.33 s and 0.67 s of
      #     simulated time — which no plan-and-execute cycle beats, so the belt has
      #     to be gated by the line and today nothing gates it.
      #
      # PROMOTION CONDITIONS. All four, and none is a tolerance change:
      #   1. station_transfer_1's pick point is observable — either the model gives
      #      the infeed something to observe with, or L4 stops gating a source-fed
      #      station's cycle on Detect. Today the line cannot start.
      #   2. A detection carries the work-piece's pose rather than the sensor's, so
      #      that a station picks where the part is.
      #   3. The belt setpoint has an owner at L4, and the line gates the belt on the
      #      beam rather than running it open-loop.
      #   4. It passes repeatedly rather than once, cycle AND teardown. Scenarios here
      #      are not reproducible (ADR-0027), so a single green run promotes nothing —
      #      that is the trap the block above was measured into and had to retract.
      - name: Simulation-in-the-loop scenario — continuous_line (advisory)
        continue-on-error: true
        run: |
          docker run --rm --shm-size=2gb -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/scenario continuous_line

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: workspace/log/
          if-no-files-found: ignore

  # Reproducibility is a first-class CI concern here, not an afterthought.
  # The previous iteration of this project died of a dependency failure.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Third-party source vendored into the tree
        run: |
          if [ -d workspace/src/external ] && \
             git ls-files --error-unmatch workspace/src/external >/dev/null 2>&1; then
            echo "::error::External source is tracked in git. It must be imported by vcstool, not committed."
            exit 1
          fi
          echo "No vendored external source."

      - name: Gitlinks without a .gitmodules entry
        run: |
          links=$(git ls-files -s | awk '$1=="160000" {print $4}')
          if [ -n "$links" ] && [ ! -f .gitmodules ]; then
            echo "::error::Submodule gitlinks exist with no .gitmodules — a fresh clone would lose them:"
            echo "$links"
            exit 1
          fi
          echo "No orphaned gitlinks."

      - name: CVE scan (advisory)
        # Advisory, not blocking. The pinned tooling versions currently carry known
        # advisories; making this a hard gate would block every unrelated change
        # before anyone has assessed whether the affected paths are reachable.
        # Tighten to --strict once the pins are triaged.
        continue-on-error: true
        run: |
          docker build -f infra/docker/Dockerfile -t cite-digital-twin:dev . >/dev/null
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            cite-digital-twin:dev ./scripts/audit-deps

      - name: Manifest entries not pinned to a commit SHA
        # One implementation, shared with ./scripts/doctor (P1). This step used to
        # restate the check as `grep -E '^\s+version:\s*[a-z]'`, which is a
        # starts-with-lowercase test rather than a SHA validator: it called a real
        # 40-character SHA beginning with a-f unpinned, and passed a branch named
        # `2.x` as pinned. Two copies of a check are two chances to be wrong
        # differently, which is what happened.
        #
        # Blocking, not advisory. This is the only mechanical guard on ADR-0008.
        run: |
          # shellcheck source=scripts/_lib.sh
          source scripts/_lib.sh
          unpinned="$(unpinned_manifest_entries)"
          if [ -n "$unpinned" ]; then
            echo "$unpinned" | while read -r entry; do
              echo "::error file=external/cite.repos::Not pinned to a commit SHA: ${entry}"
            done
            exit 1
          fi
          echo "All manifest entries pinned to a 40-character commit SHA."

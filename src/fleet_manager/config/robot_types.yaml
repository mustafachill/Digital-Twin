# ============================================
# ROBOT TYPE DEFINITIONS
# ============================================
# Her robot tipi için URDF ve controller ayarları
# ============================================

robot_types:
  xarm5:
    description: "UFACTORY xArm 5 DOF"
    manufacturer: "UFACTORY"
    dof: 5
    
    # URDF configuration
    urdf:
      package: "xarm_description"
      file: "urdf/xarm5/xarm5.urdf.xacro"
      
    # Controller configuration
    controller:
      package: "xarm_controller"
      config_file: "config/xarm5_controllers.yaml"
      trajectory_controller: "{prefix}xarm5_traj_controller"
      joint_state_broadcaster: "joint_state_broadcaster"
      
    # Joint names (prefix will be added)
    joints:
      - "joint1"
      - "joint2"
      - "joint3"
      - "joint4"
      - "joint5"
      
    # Gripper options
    grippers:
      xarm_gripper:
        urdf_macro: "xarm_gripper"
        controller: "{prefix}xarm_gripper_traj_controller"
        config_file: "config/xarm_gripper_controllers.yaml"
        joints:
          - "drive_joint"
          
      vacuum_gripper:
        urdf_macro: "vacuum_gripper"
        controller: "{prefix}vacuum_gripper_controller"
        
    # Physical limits
    limits:
      max_velocity: 1.0          # rad/s
      max_acceleration: 2.0      # rad/s^2
      workspace_radius: 0.7      # metres
      
  xarm6:
    description: "UFACTORY xArm 6 DOF"

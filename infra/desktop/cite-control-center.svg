<?xml version="1.0" encoding="UTF-8"?>
<!-- CITE Control Center icon (ADR-0078). Drawn for this project: an arm on a
     linear track, in dark slate with the SHSU orange accent. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>CITE Control Center</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#tile)"/>
  <!-- Linear track -->
  <rect x="16" y="98" width="96" height="8" rx="4" fill="#94A3B8"/>
  <rect x="16" y="106" width="96" height="3" rx="1.5" fill="#64748B"/>
  <!-- Carriage -->
  <rect x="38" y="88" width="32" height="12" rx="3" fill="#F76800"/>
  <!-- Base -->
  <rect x="45" y="76" width="18" height="13" rx="3" fill="#E2E8F0"/>
  <!-- Upper arm and forearm -->
  <g stroke="#E2E8F0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M54 76 L44 46" stroke-width="10"/>
    <path d="M44 46 L82 34" stroke-width="8"/>
  </g>
  <!-- Joints -->
  <circle cx="54" cy="76" r="7" fill="#F76800"/>
  <circle cx="44" cy="46" r="7" fill="#F76800"/>
  <circle cx="82" cy="34" r="5.5" fill="#F76800"/>
  <!-- Gripper -->
  <g stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M86 36 L94 44"/>
    <path d="M88 30 L98 34"/>
  </g>
</svg>

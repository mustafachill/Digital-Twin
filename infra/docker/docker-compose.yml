# =============================================================================
# CITE Digital Twin — development services
#
# Invoked through ./scripts/*, not directly. The scripts pass the host UID/GID
# and pick the right service, so that a developer never has to remember flags.
#
#   dev       default: headless build, test, and simulation
#   gui       adds display passthrough for Gazebo GUI and RViz (Linux host)
#   hardware  adds host networking and device passthrough for real robots
# =============================================================================

---
# FALLBACK ONLY. Every ./scripts/* invocation passes `-p` with a project name
# derived from the checkout's absolute path (see cite_project_name in
# scripts/_lib.sh), and that overrides this key. It is kept for the person who
# runs `docker compose -f infra/docker/docker-compose.yml ...` by hand, because
# without any project name compose derives one from this file's parent directory
# — "docker" — which collides with every other project that keeps its compose
# file in a docker/ directory.
#
# Do NOT read this name as the project the scripts use. It was, and that was the
# defect: a single fixed name means a single set of `cite-digital-twin_cite-*`
# volumes shared by every checkout on the machine. Concurrent builds corrupted
# each other through them, one checkout ran another's binaries out of the shared
# install volume, and `./scripts/clean --all` destroyed a build belonging to a
# different worktree. A direct `docker compose` invocation still lands here and
# still shares; the scripts are the supported path precisely because they do not.
name: cite-digital-twin

# The environment is anchored separately from the rest of the service definition
# because a YAML merge key does not deep-merge a mapping: a service that declares
# `environment:` at all replaces this block wholesale rather than adding to it.
# The gui service does exactly that, and before this anchor existed it restated
# every variable — so ROS_DOMAIN_ID had two definitions that had to be kept in
# step by hand, which is the duplication P1 exists to forbid.
x-common-env: &common-env
  # Supplied by scripts/_lib.sh, which derives one domain per checkout so that two
  # cells on this host cannot discover each other. The previous ${...:-0} default
  # put every container on domain 0 and DDS discovery crossed between them: a
  # scenario run took 421 s instead of 105 s because another workspace's
  # move_group was in its graph. The fallback below is only for a direct
  # `docker compose` invocation, and is deliberately not 0. Prefer ./scripts/enter,
  # which supplies the derived value — see cite_domain_id in scripts/_lib.sh.
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  # Gazebo needs a writable home for its cache.
  HOME: /home/cite

x-common: &common
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
    args:
      USER_UID: ${CITE_UID:-1001}
      USER_GID: ${CITE_GID:-1001}
  image: cite-digital-twin:dev
  working_dir: /workspace
  volumes:
    # The repository, mounted rather than copied: edits on the host are visible
    # immediately, and build artifacts land in the host's gitignored dirs.
    - ../..:/workspace:cached
    # Named volumes for build output. Keeping these out of the bind mount makes
    # builds substantially faster on macOS and avoids permission churn.
    - cite-build:/workspace/workspace/build
    - cite-install:/workspace/workspace/install
    - cite-log:/workspace/workspace/log
  environment: *common-env
  # Shared memory: the default 64 MB is not enough for DDS or Gazebo and
  # produces failures that look like network problems.
  shm_size: '2gb'
  # No `init:` here — the image already runs tini as its entrypoint. Adding
  # docker-init would make tini a child of it, which is what produced
  # "Tini is not running as PID 1" and silently disabled zombie reaping.

services:
  dev:
    <<: *common
    command: bash

  gui:
    <<: *common
    environment:
      # Merged, not restated: a GUI shell and the headless cell it inspects must
      # be on the same ROS_DOMAIN_ID or they see nothing of each other.
      <<: *common-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ../..:/workspace:cached
      - cite-build:/workspace/workspace/build
      - cite-install:/workspace/workspace/install
      - cite-log:/workspace/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash

  # Real hardware. Host networking is required because DDS discovery does not
  # cross Docker's default bridge reliably, and the physical arms must be
  # reachable on the lab network.
  #
  # This service inherits the per-checkout ROS_DOMAIN_ID from x-common, which is
  # what you want for isolation and is *not* what you want when joining a lab
  # network where other machines are already on a known domain. Set ROS_DOMAIN_ID
  # explicitly in the environment before ./scripts/enter hardware in that case.
  # Phase 2 concern; recorded here so it is not rediscovered at the robot.
  hardware:
    <<: *common
    network_mode: host
    privileged: true
    volumes:
      - ../..:/workspace:cached
      - cite-build:/workspace/workspace/build
      - cite-install:/workspace/workspace/install
      - cite-log:/workspace/workspace/log
      - /dev:/dev
    command: bash

# Declared bare, and scoped by compose to the project name — so with the derived
# per-checkout project these become `cite-<checkout>-<hash>_cite-build` and are
# private to one worktree. That scoping is the whole isolation mechanism; naming
# them absolutely here (`name: cite-build`) would opt out of it and hand every
# checkout the same volume again.
volumes:
  cite-build:
  cite-install:
  cite-log:

# Robot Positions Configuration
# Positions of 3 xArm 5 robots along the assembly line conveyor

robots:
  xarm1:
    name: "xarm1"
    prefix: "xarm1_"
    namespace: "/xarm1"
    pose:
      x: -0.5       # Distance from conveyor center
      y: -1.2       # Station 1 position along belt
      z: 0.8        # Table height
      roll: 0.0
      pitch: 0.0
      yaw: 1.5708   # 90 degrees - facing conveyor
    role: "pick"
    station_id: 1
    
  xarm2:
    name: "xarm2"
    prefix: "xarm2_"
    namespace: "/xarm2"
    pose:
      x: -0.5
      y: 0.0        # Station 2 position (middle)
      z: 0.8
      roll: 0.0
      pitch: 0.0
      yaw: 1.5708
    role: "transfer"
    station_id: 2
    
  xarm3:
    name: "xarm3"
    prefix: "xarm3_"
    namespace: "/xarm3"
    pose:
      x: -0.5
      y: 1.2        # Station 3 position
      z: 0.8
      roll: 0.0
      pitch: 0.0
      yaw: 1.5708
    role: "place"
    station_id: 3

# Robot configuration
robot_config:
  type: "xarm"
  dof: 5
  add_gripper: true
  gripper_type: "xarm_gripper"


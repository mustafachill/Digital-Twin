# Coordinator Parameters

coordinator_node:
  ros__parameters:
    # Detection thresholds
    break_beam_threshold: 0.4    # metres - object detected if range < threshold
    proximity_threshold: 0.15   # metres - object close enough to pick
    
    # Timing
    control_loop_rate: 10.0     # Hz
    state_publish_rate: 1.0     # Hz
    
    # Trajectory timing
    trajectory_duration: 2.0    # seconds per movement

sensor_monitor:
  ros__parameters:
    publish_rate: 5.0           # Hz
    break_beam_threshold: 0.4
    
box_spawner:
  ros__parameters:
    spawn_interval: 15.0        # seconds between auto-spawns
    spawn_x: 0.0
    spawn_y: -1.8
    spawn_z: 0.85
    auto_spawn: false           # Set true for automatic spawning


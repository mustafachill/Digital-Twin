# Robot Interface Configuration
# Per-robot configuration for pick/place positions

# ==========================================
# Robot 1 - Pick Station (Entry)
# ==========================================
robot_1:
  role: "pick"
  # Pick position: from conveyor belt
  pick_position: [0.0, 0.35, 0.05]
  # Place position: to robot_2
  place_position: [0.35, 0.0, 0.15]
  # Home position (joint angles in radians)
  home_position: [0.0, -0.5, 0.0, 1.0, 0.0]

# ==========================================
# Robot 2 - Transfer Station (Middle)
# ==========================================
robot_2:
  role: "transfer"
  # Pick position: from robot_1
  pick_position: [-0.35, 0.0, 0.15]
  # Place position: to robot_3
  place_position: [0.35, 0.0, 0.15]
  home_position: [0.0, -0.5, 0.0, 1.0, 0.0]

# ==========================================
# Robot 3 - Place Station (Exit)
# ==========================================
robot_3:
  role: "place"
  # Pick position: from robot_2
  pick_position: [-0.35, 0.0, 0.15]
  # Place position: to conveyor belt
  place_position: [0.0, 0.35, 0.05]
  home_position: [0.0, -0.5, 0.0, 1.0, 0.0]

# ==========================================
# Timing Parameters
# ==========================================
timing:
  pick_duration: 2.0          # seconds
  place_duration: 2.0         # seconds
  gripper_close_time: 0.5     # seconds
  gripper_open_time: 0.5      # seconds
  handoff_timeout: 10.0       # seconds

# ==========================================
# Safety Parameters
# ==========================================
safety:
  max_velocity: 0.5           # m/s
  collision_threshold: 0.1    # metres
  force_limit: 10.0           # Newtons








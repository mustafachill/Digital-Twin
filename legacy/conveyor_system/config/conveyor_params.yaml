# Conveyor System Parameters
# Assembly Line Configuration

conveyor:
  # Belt dimensions
  length: 4.0        # metres
  width: 0.45        # metres
  height: 0.8        # metres (table height)
  
  # Speed settings
  default_speed: 0.1     # m/s
  max_speed: 0.5         # m/s
  
  # Station positions (Y coordinate along belt)
  stations:
    station_1:
      y_position: -1.2   # Robot 1 position
      name: "pick_station"
    station_2:
      y_position: 0.0    # Robot 2 position
      name: "transfer_station"
    station_3:
      y_position: 1.2    # Robot 3 position
      name: "place_station"

# Robot positions relative to conveyor
robots:
  xarm1:
    x: -0.5
    y: -1.2
    z: 0.8
    yaw: 1.57   # facing belt
  xarm2:
    x: -0.5
    y: 0.0
    z: 0.8
    yaw: 1.57
  xarm3:
    x: -0.5
    y: 1.2
    z: 0.8
    yaw: 1.57

# Box spawning
box_spawn:
  position:
    x: 0.0
    y: -1.8     # Start of belt
    z: 0.85     # On belt surface
  spawn_interval: 10.0  # seconds between spawns

